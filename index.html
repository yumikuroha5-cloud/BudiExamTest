<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1d3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>ExamForge</title>
<style>
:root{--navy:#0b1d3a;--blue:#3b6ff5;--violet:#7c5cf0;--bg:#f2f5ff;--tx:#0f1b33;--mut:#5f6b8a;--ok:#16a34a;--bad:#dc2626;--bd:#e1e7f5;--sh:0 4px 16px rgba(25,45,110,.08);--sh2:0 12px 30px rgba(25,45,110,.16);--hh:56px}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#e6edff 0,var(--bg) 340px) var(--bg);min-height:100vh;color:var(--tx);overflow-x:hidden}
.ic{flex:none;vertical-align:middle}
header{background:linear-gradient(120deg,#0b1d3a,#1e3a8a 60%,#3d4fe0);color:#fff;padding:0 14px;height:var(--hh);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(11,29,58,.35)}
header img{width:34px;height:34px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.3)}header h1{font-size:1.2rem;margin:0;flex:1;min-width:0;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#net{font-size:.75rem;padding:4px 11px;border-radius:99px;background:#16a34a;white-space:nowrap;font-weight:600}#net.off{background:#d97706}
#inst{min-height:36px;padding:4px 12px;font-size:.85rem;border-radius:99px}
.hbtn{min-height:38px;width:40px;padding:0;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:12px;position:relative}
.hbtn:hover{background:rgba(255,255,255,.26)}
.hbtn.on::after{content:"";position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 0 2px #1e3a8a;animation:pl 1.4s infinite}
@keyframes pl{50%{transform:scale(1.35);opacity:.7}}
main{max-width:960px;margin:0 auto;padding:14px 12px 24px}
.card{background:rgba(255,255,255,var(--ua));border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px;overflow-wrap:anywhere;box-shadow:var(--sh);scroll-margin-top:calc(var(--hh) + 12px)}
h2{margin:0 0 8px;font-size:1.1rem}.mut{color:var(--mut);font-size:.9rem}
.ch{display:flex;align-items:center;gap:10px;font-size:1.15rem}
.ci{width:36px;height:36px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));flex:none}
.ci.g{background:linear-gradient(135deg,#10b981,#06b6d4)}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.6px;padding:2px 9px;border-radius:99px;background:#ffedd5;color:#c2410c}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn,button{font:inherit;min-height:46px;padding:8px 16px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,var(--ua));color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .15s,background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.btn:hover,button:hover:not(:disabled){box-shadow:0 4px 12px rgba(25,45,110,.12);border-color:#c5d0ea}
.btn:active,button:active:not(:disabled){transform:scale(.97)}
:is(.btn,button,input,textarea):focus-visible{outline:3px solid rgba(59,111,245,.45);outline-offset:2px}
.pri{background:linear-gradient(135deg,var(--blue),var(--violet));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(59,111,245,.35)}
.pri:hover:not(:disabled){border-color:transparent;box-shadow:0 6px 16px rgba(59,111,245,.45)}
.dng{color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
.msg{border-radius:16px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--sh)}.msg.err{background:#fee2e2;color:#7f1d1d}.msg.ok{background:#dcfce7;color:#14532d}.msg ul{margin:6px 0 0;padding-left:20px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.stat{background:#f0f4ff;border-radius:14px;padding:10px 14px;flex:1 1 110px}.stat b{display:block;font-size:1.3rem;color:var(--blue)}
.hr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--bd)}.hr>div{flex:1 1 100%;min-width:0}.hr .sc{font-weight:700;color:var(--blue);font-size:1.05rem;background:#e8f0ff;border-radius:99px;padding:2px 12px}.hr>:nth-child(2){margin-right:auto}
.hr button{min-height:38px;padding:4px 12px;font-size:.9rem}.hr .rt{color:var(--blue);border-color:#c9d8fb;background:#f3f7ff}.hr .rt .ic{margin-right:-2px}
.sub{margin:18px 0 0;font-size:1rem;color:var(--mut)}
.bar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,#0b1d3a,#1e3a8a);color:#fff;border-radius:16px;padding:12px 18px;margin-bottom:14px;position:sticky;top:calc(var(--hh) + 6px);z-index:4;box-shadow:var(--sh2)}
.tm{font-variant-numeric:tabular-nums;font-weight:700}.tm.low{color:#fca5a5}
.qt{font-size:1.1rem;font-weight:600;margin-bottom:12px}.pts{font-size:.75rem;color:var(--mut);font-weight:400;white-space:nowrap}
.opt{display:flex;width:100%;gap:12px;text-align:left;justify-content:flex-start;margin-bottom:10px;padding:12px 14px;border-radius:16px}.opt b{min-width:28px;height:28px;border-radius:50%;background:#eaf0ff;color:var(--blue);display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt.sel{border-color:var(--blue);background:#e8f0ff;box-shadow:0 0 0 2px rgba(59,111,245,.2)}.opt.sel b{background:var(--blue);color:#fff}
textarea{width:100%;min-height:200px;font:inherit;padding:12px;border:1px solid var(--bd);border-radius:14px;resize:vertical}
.grid{display:flex;flex-wrap:wrap;gap:6px}.grid button{min-height:42px;width:42px;padding:0;border-radius:12px}
.grid .done{background:#dbeafe;border-color:var(--blue)}.grid .cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.nav{display:flex;gap:8px;position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 75%,rgba(242,245,255,0));padding:14px 0 8px}.nav button{flex:1}
.big{font-size:3rem;font-weight:800;color:var(--blue);line-height:1}
.rv{border-left:5px solid var(--bd)}.rv.ok{border-color:var(--ok)}.rv.no{border-color:var(--bad)}.rv.es{border-color:var(--blue)}
.ans{background:#f0f4ff;border-radius:12px;padding:8px 12px;margin:6px 0;white-space:pre-wrap}
input[type=number]{font:inherit;width:90px;padding:8px;border:1px solid var(--bd);border-radius:12px}

/* Dashboard */
.hero{background:linear-gradient(135deg,#2f6bf0 0,#5b5df0 55%,#8b5cf6 100%);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:var(--sh2);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero>*{position:relative;z-index:1}
.hero .hi{font-size:.9rem;opacity:.9}
.hero h2{font-size:1.55rem;line-height:1.2;margin:2px 0 4px}.hero p{margin:0 0 14px;opacity:.9;font-size:.95rem}
.hs{display:flex;gap:8px}.hs>div{flex:1;background:rgba(255,255,255,.18);border-radius:16px;padding:8px 6px;text-align:center;font-size:.75rem;line-height:1.2}.hs b{display:block;font-size:1.35rem}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.tile{position:relative;overflow:hidden;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;text-align:left;border:0;color:#fff;padding:16px;min-height:132px;border-radius:22px;box-shadow:var(--sh2);width:100%}
.tile:hover:not(:disabled){box-shadow:0 16px 34px rgba(25,45,110,.28);transform:translateY(-2px)}
.tile::after{content:"";position:absolute;right:-30px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.16)}
.tile>*{position:relative;z-index:1}
.ti{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center}
.tile b{font-size:1.1rem;line-height:1.15}.tile small{font-size:.8rem;opacity:.92;line-height:1.3;overflow-wrap:anywhere}
.tile.asas{grid-column:1/-1;background:linear-gradient(135deg,#ff8a3d,#f43f8e);min-height:150px}
.tile.asas b{font-size:1.7rem;letter-spacing:.5px}.tile.asas small{font-size:.9rem}
.tile.asas .go{margin-top:auto;background:#fff;color:#e11d74;font-weight:700;font-size:.8rem;padding:5px 12px;border-radius:99px;display:inline-flex;align-items:center;gap:4px}
.tile.hist{background:linear-gradient(135deg,#10b981,#06b6d4)}
.tile.mus{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.flash{animation:fl 1.4s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 0 rgba(244,63,142,.7)}60%{box-shadow:0 0 0 12px rgba(244,63,142,0)}100%{box-shadow:var(--sh)}}

/* Music player */
.mp{position:fixed;z-index:40;top:calc(var(--hh) + 8px);right:12px;width:min(360px,calc(100vw - 24px));background:#fff;border:1px solid var(--bd);border-radius:22px;box-shadow:0 18px 44px rgba(11,29,58,.3);padding:16px}
.mp[hidden]{display:none}
.mp-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}.mp-h b{flex:1;font-size:1.05rem}
.mp-h button{min-height:36px;width:36px;padding:0;border-radius:11px}
.mp-name{display:flex;align-items:center;gap:10px;background:#f0f4ff;border-radius:14px;padding:10px 12px;font-weight:600;overflow-wrap:anywhere;word-break:break-word}
.mp-name.empty{color:var(--mut);font-weight:400}
.mp-ctl{display:flex;gap:8px;margin:12px 0}.mp-ctl button{flex:1;padding:8px 6px}
.mp-vol{display:flex;align-items:center;gap:10px;color:var(--mut)}.mp-vol input{flex:1;accent-color:var(--blue);height:28px;min-width:0}.mp-vol span{min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.mp-lp{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:.9rem}.mp-lp input{width:20px;height:20px;accent-color:var(--blue)}
.mp-st{margin:10px 0 0;font-size:.85rem}.mp-st.err{color:var(--bad)}

.lbtn{width:auto;padding:0 10px;gap:5px;font-size:.8rem;font-weight:700}
.mp{max-height:calc(100vh - var(--hh) - 20px);overflow:auto}
.mp-ctl{gap:6px}.mp-ctl button{gap:5px;padding:8px 4px;font-size:.9rem}.mp-ctl .sq{flex:0 0 44px}
.m-list{margin:8px 0 0;max-height:170px;overflow:auto}.m-list:empty{display:none}
.trk{display:flex;align-items:center;gap:4px;border-radius:12px}.trk.on{background:#eaf0ff}
.trk .tn{flex:1;min-width:0;justify-content:flex-start;text-align:left;border:0;background:transparent;min-height:40px;padding:4px 8px;gap:10px;box-shadow:none}.trk .tn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .no{width:20px;text-align:center;color:var(--mut);font-size:.8rem}.trk .tx{min-height:36px;width:36px;padding:0;border:0;background:transparent;color:var(--bad);box-shadow:none}

/* Profile + background + settings */
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;pointer-events:none}#bg[hidden],.st[hidden]{display:none}
#bg img,#bg video,.pv img,.pv video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06)}
#bg [hidden],.pv [hidden]{display:none}#bg .o,.pv .o{position:absolute;top:0;left:0;width:100%;height:100%}
.bg-on .nav{background:none}
.st{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;background:rgba(11,29,58,.4);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--hh) / 2) 10px 28px}
.st-sheet{max-width:560px;margin:0 auto;background:#f4f7ff;border-radius:24px;padding:14px;box-shadow:var(--sh2)}.st-sheet .card{box-shadow:none}
.st-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}.st-h b{flex:1;font-size:1.25rem}.st-h button{min-height:38px;width:38px;padding:0;border-radius:12px}
.fld{display:block;margin-top:10px}.fld span{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}.fld input{width:100%;font:inherit;padding:10px 12px;min-height:46px;border:1px solid var(--bd);border-radius:12px}.fld input.bad{border-color:var(--bad)}.perr{margin:6px 0 0;font-size:.85rem;min-height:1.2em}
.seg{display:flex;gap:4px;background:#e6ecfb;border-radius:14px;padding:4px;margin-top:6px}.seg button{flex:1;border:0;background:transparent;min-height:42px;border-radius:11px;box-shadow:none;padding:4px}.seg button.on{background:#fff;color:var(--blue);font-weight:700;box-shadow:var(--sh)}
.up{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}.fn{flex:1 1 100%;font-size:.8rem;overflow-wrap:anywhere}.sm{min-height:36px;padding:4px 12px;font-size:.85rem}
.pv{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#e6edff,#f4f7ff);border:1px solid var(--bd);margin-top:8px;display:flex;align-items:center;justify-content:center}.pvt{position:relative;color:var(--mut);font-size:.9rem;padding:10px;text-align:center}
.tg{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:36px}.tg input{width:22px;height:22px;accent-color:var(--blue)}
.sl{display:grid;grid-template-columns:112px 1fr 46px;font-size:.95rem;align-items:center;gap:8px;margin-top:6px}.sl input{accent-color:var(--blue);height:32px;min-width:0}.sl output{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;font-size:.9rem}
@media(max-width:430px){#net{font-size:0;padding:0;width:12px;height:12px;min-width:12px;flex:none}}
@media(min-width:700px){main{padding:24px}.opt:hover{border-color:var(--blue)}.tiles{grid-template-columns:repeat(4,1fr)}.tile.asas{grid-column:span 2}.hero{padding:26px 28px}.hero h2{font-size:1.9rem}.hs{max-width:460px}.mp{right:max(16px,calc((100vw - 960px)/2 + 24px))}}
@media(max-width:380px){header{gap:6px;padding:0 10px}header h1{font-size:1.05rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--ua:1;--p:calc(var(--ua)*100%)}
.ui-t .card,.ui-t .btn,.ui-t button:not(.pri):not(.hbtn){-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@supports (background:color-mix(in srgb,red 50%,transparent)){
.pri{background:linear-gradient(135deg,color-mix(in srgb,#3b6ff5 var(--p),transparent),color-mix(in srgb,#7c5cf0 var(--p),transparent))}
.hero{background:linear-gradient(135deg,color-mix(in srgb,#2f6bf0 var(--p),transparent) 0,color-mix(in srgb,#5b5df0 var(--p),transparent) 55%,color-mix(in srgb,#8b5cf6 var(--p),transparent) 100%)}
.tile.asas{background:linear-gradient(135deg,color-mix(in srgb,#ff8a3d var(--p),transparent),color-mix(in srgb,#f43f8e var(--p),transparent))}
.tile.hist{background:linear-gradient(135deg,color-mix(in srgb,#10b981 var(--p),transparent),color-mix(in srgb,#06b6d4 var(--p),transparent))}
.tile.mus{background:linear-gradient(135deg,color-mix(in srgb,#8b5cf6 var(--p),transparent),color-mix(in srgb,#6366f1 var(--p),transparent))}
.bar{background:linear-gradient(120deg,color-mix(in srgb,#0b1d3a var(--p),transparent),color-mix(in srgb,#1e3a8a var(--p),transparent))}
}
.opt.ok{border-color:var(--ok);background:#e8f7ee}.opt.ok b{background:var(--ok);color:#fff}.opt.no{border-color:var(--bad);background:#fdeaea}.opt.no b{background:var(--bad);color:#fff}.fb{margin-top:10px;padding:10px 14px;border-radius:14px;background:#f0f4ff;border-left:5px solid var(--blue)}.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}.fb p{margin:6px 0 0}.tp{margin:10px 0}.bar2{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:4px}.bar2 i{display:block;height:100%;background:var(--ok)}.tp.weak .bar2 i{background:var(--bad)}
.tile.gd{grid-column:1/-1;min-height:104px;background:linear-gradient(135deg,#f59e0b,#ef4444)}.stepl{padding-left:22px;margin:8px 0}.stepl li{margin:6px 0}.gg{display:flex;flex-wrap:wrap;gap:10px}.gg label{flex:1 1 130px;font-size:.85rem;color:var(--mut)}.gg input,.gg select{display:block;width:100%;margin-top:4px;font:inherit;padding:8px 10px;min-height:44px;border:1px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx)}.gtxt{min-height:260px;font:.8rem/1.45 ui-monospace,Consolas,monospace}
</style></head><body>
<header><img src="icon-192.png" alt=""><h1>ExamForge</h1><button id="inst" class="pri" style="display:none">Install</button><button id="lbtn" class="hbtn lbtn"></button><button id="sbtn" class="hbtn" data-s="open" aria-haspopup="dialog"></button><button id="mbtn" class="hbtn" data-m="toggle" aria-expanded="false" aria-controls="mp"></button><span id="net">Online</span></header>
<div id="bg" hidden aria-hidden="true"><img id="bg-i" alt="" hidden><video id="bg-v" muted loop playsinline autoplay preload="auto" hidden></video><div class="o"></div></div>
<div id="st" class="st" hidden><div class="st-sheet" role="dialog" aria-modal="true" aria-labelledby="st-t"><div class="st-h"><b id="st-t"></b><button id="st-x" data-s="close"></button></div><div id="st-body"></div></div></div>
<section id="mp" class="mp" hidden>
<div class="mp-h"><b id="t-mt"></b><button data-m="close" id="m-x"></button></div>
<div id="mp-name" class="mp-name empty"></div>
<div class="mp-ctl"><button id="m-prev" class="sq" data-m="prev" disabled></button><button id="m-play" class="pri" data-m="play" disabled></button><button id="m-pause" data-m="pause" disabled></button><button id="m-stop" data-m="stop" disabled></button><button id="m-next" class="sq" data-m="next" disabled></button></div>
<div class="mp-vol"><span id="m-vic"></span><input id="m-vol" type="range" min="0" max="100" step="1"><span id="m-volv"></span></div>
<label class="mp-lp"><input type="checkbox" id="m-loop"><span id="t-lp"></span></label>
<div id="m-list" class="m-list"></div>
<div class="row"><label class="btn" for="mfile" id="m-add"></label><input id="mfile" type="file" multiple accept=".mp3,.wav,.ogg,audio/mpeg,audio/wav,audio/x-wav,audio/ogg" hidden></div>
<p id="mp-st" class="mut mp-st" aria-live="polite"></p>
</section>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app'),L=['A','B','C','D','E'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert(t('saveFail'))}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---- Languages (EN / ID) ---- */
const T={en:{bui:'Button transparency',bfrm:'Phone framing (ratio)',bfrmh:'Adjust how the background fits your phone screen. The preview has the same shape as your screen.',bfill:'Fill',bfit:'Fit',bstr:'Stretch',bzoom:'Zoom',bpx:'Left–Right',bpy:'Up–Down',helloN:n=>'Hello, '+n+'! 👋',from:n=>'From '+n,setupT:'Welcome to ExamForge',setupP:'Tell us a little about you. It is saved only on this device – no account needed.',pname:'Student name',pschool:'School name (optional)',pcls:'Class / Grade (optional)',pph:'e.g. Gudi',psave:'Save profile',pskip:'Skip',pneed:'Please enter your name.',

function mLoad(i){const x=mus.tr[i];if(!x)return;mus.cur=i;mus.a.src=x.url;mus.a.load()}
function mPlay(){if(!mcur())return;mus.err='';const p=mus.a.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name==='AbortError')return;mus.err=t('cantplay',mcur()?mcur().name:'');mUI()});mUI()}

function mStep(d,play){const n=mus.tr.length;if(!n)return;mLoad((mus.cur+d+n)%n);if(play)mPlay();else mUI()}
function mAdd(files){mus.err='';for(const f of files){if(!M_EXT.test(f.name)&&!M_MIME.test(f.type)){mus.err=t('badfile',f.name);continue}mus.tr.push({id:++mid,name:f.name,url:URL.createObjectURL(f)})}if(mus.cur<0&&mus.tr.length)mLoad(0);mUI()}

function validate(d){const e=[];
if(!d||typeof d!=='object'||Array.isArray(d))return{e:[t('v_obj')]};
if(typeof d.title!=='string'||!d.title.trim())e.push(t('v_title'));
if(typeof d.subject!=='string'||!d.subject.trim())e.push(t('v_subject'));
if(d.duration!=null&&!(typeof d.duration==='number'&&d.duration>=0))e.push(t('v_dur'));
if(!Array.isArray(d.questions)||!d.questions.length)return{e:[...e,t('v_qs')]};
const qs=d.questions.map((q,i)=>{const n=t('q_pre',i+1);
 if(!q||typeof q!=='object'){e.push(n+t('q_notobj'));return null}
 if(typeof q.question!=='string'||!q.question.trim())e.push(n+t('q_text'));
 const p=q.points==null?1:q.points;if(typeof p!=='number'||!(p>0))e.push(n+t('q_pts'));
 let ans=typeof q.answer==='string'?q.answer.trim().toUpperCase():q.answer;
 if(q.type==='true_false'){const m={TRUE:'B',BENAR:'B',B:'B',T:'B',YA:'B',FALSE:'S',SALAH:'S',S:'S',F:'S'};ans=ans===true?'B':ans===false?'S':m[ans]}
 if(q.type==='multiple_choice'){
  if(!q.options||typeof q.options!=='object')e.push(n+t('q_opts'));
  else for(const k of L)if(typeof q.options[k]!=='string'||!q.options[k].trim())e.push(n+t('q_opt',k));
  if(!L.includes(ans))e.push(n+t('q_ans'));
 }else if(q.type==='true_false'){
  if(ans!=='B'&&ans!=='S')e.push(n+t('q_tf'));
 }else if(q.type==='essay'){
  if(q.keywords!=null&&!Array.isArray(q.keywords))e.push(n+t('q_kw'));
  if(q.rubric!=null&&!Array.isArray(q.rubric))e.push(n+t('q_rb'));
  if(!q.expected_answer&&!(Array.isArray(q.keywords)&&q.keywords.length))e.push(n+t('q_need'));
 }else e.push(n+t('q_type'));
 return{...q,topic:typeof q.topic==='string'?q.topic.trim():'',answer:ans,points:p,keywords:Array.isArray(q.keywords)?q.keywords.map(String):[],rubric:Array.isArray(q.rubric)?q.rubric:[]}});
if(e.length)return{e:e.slice(0,8).concat(e.length>8?[t('more',e.length-8)]:[])};
return{bank:{title:d.title.trim(),subject:d.subject.trim(),duration:d.duration||0,questions:qs,materi:Array.isArray(d.materi)?d.materi.filter(m=>m&&typeof m==='object'):[]}}}

 const v=validate(d);if(v.e){lastErr=v.e;msg={t:'err',h:t('problem',name),l:v.e};return home()}
 const k=s=>(s.title+'|'+s.subject).toLowerCase(),old=lib.find(x=>k(x.bank)===k(v.bank));let id;
 if(old){old.bank=v.bank;old.name=name;id=old.id}else{id=Date.now();lib.push({id,name,bank:v.bank})}
 ls.set('ef_lib',lib);setActive(id);msg={t:'ok',h:t(old?'updated':'saved',name),l:[]};home()}

function submit(force){const n=ex.qs.length,un=n-cnt();
 if(!force&&!confirm(t('sub1',un)))return;
 clearInterval(tick);window.onbeforeunload=null;
 const items=ex.qs.map((q,i)=>{const a=ex.a[i];
  if(isObj(q)){const ok=a===q.answer;return{q,a,ok,sc:ok?q.points:0,max:q.points}}
  const tt=norm(a||''),ks=q.keywords,hit=[];let f=0;
  if(ks.length){ks.forEach(k=>{const kk=norm(k);if(!kk)return;if(tt.includes(kk)){hit.push(k);f++}else{const w=kk.split(' ').filter(x=>x.length>3);if(w.length>1){const r=w.filter(x=>tt.includes(x)).length/w.length;if(r>=.6)f+=r*.5}}});f/=ks.length}
  else{const w=[...new Set(norm(q.expected_answer).split(' ').filter(x=>x.length>3))];f=w.length?w.filter(x=>tt.includes(x)).length/w.length:0}
  return{q,a,sc:Math.round(q.points*Math.min(1,f)*10)/10,max:q.points,hit}});
 res={items,prac:ex.prac,sh:ex.sh,rec:{id:Date.now(),bid:aid,subject:bank.subject,title:bank.title,date:new Date().toISOString(),n,score:0}};
 if(!drill)hist.unshift(res.rec);noteMis(items);saveRes();result()}
function tot(){const e=res.items.reduce((s,x)=>s+x.sc,0),m=res.items.reduce((s,x)=>s+x.max,0);return m?Math.round(e/m*1000)/10:0}

 return `<div class="card rv ${mcq?(x.ok?'ok':'no'):'es'}"><div class="qt">${i+1}. ${esc(q.question)}</div>`+
 (mcq?`<div class="ans">${t('yours')} ${x.a?esc(aTxt(q,x.a)):'<i>'+t('na')+'</i>'}</div><div class="ans">${t('corr')} <b>${esc(aTxt(q,q.answer))}</b></div>${q.explanation?`<p><b>${t('expl')}</b> ${esc(q.explanation)}</p>`:''}<div class="mut">${x.sc} / ${x.max} ${lang==='id'?'poin':'pts'}</div>`
 :`<div class="ans">${t('yours')}\n${x.a?esc(x.a):'<i>'+t('na')+'</i>'}</div>${q.expected_answer?`<div class="ans">${t('exp')}\n${esc(q.expected_answer)}</div>`:''}
 ${q.keywords.length?`<p class="mut">${t('kwf')} ${x.hit.length?esc(x.hit.join(', ')):'–'} (${x.hit.length}/${q.keywords.length})</p>`:''}
 ${q.rubric.length?'<p class="mut">'+t('rub')+' '+q.rubric.map(r=>esc(r.criterion)+' ('+esc(r.points)+')').join(' · ')+'</p>':''}
 <label>${t('sc')} <input type="number" min="0" max="${x.max}" step="0.5" value="${x.sc}" data-adj="${i}"> / ${x.max}</label>`)+`</div>`}).join('')}

let drill=null,lastErr=[],mis=ls.get('ef_mis',[]);if(!Array.isArray(mis))mis=[];mis=mis.filter(m=>m&&m.q&&typeof m.k==='string');
const cleanJ=s=>{s=String(s).replace(/^\uFEFF/,'').trim();const m=s.match(/```(?:json)?\s*([\s\S]*?)```/i);if(m)s=m[1];const a=s.indexOf('{'),b=s.lastIndexOf('}');return a>=0&&b>a?s.slice(a,b+1):s};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function mk(q,sh){if(!sh||q.type!=='multiple_choice')return{...q,_o:q};const o={};let an=q.answer;shuf(L.map(k=>[k,q.options[k]])).forEach(([k,x],i)=>{o[L[i]]=x;if(k===q.answer)an=L[i]});return{...q,options:o,answer:an,_o:q}}
function noteMis(items){let ch=0;items.forEach(x=>{const q=x.q._o||x.q,bad=isObj(x.q)?!x.ok:x.sc<x.max*.6,i=mis.findIndex(m=>m.k===q.question);
 if(bad&&i<0){mis.push({k:q.question,s:bank.subject,q});ch=1}else if(!bad&&i>=0){mis.splice(i,1);ch=1}});
 if(mis.length>150)mis.splice(0,mis.length-150);if(ch)ls.set('ef_mis',mis)}
function startDrill(){if(!mis.length)return;if(!drill)drill={bank,aid};
 bank={title:t('drillT'),subject:[...new Set(mis.map(m=>m.s).filter(Boolean))].slice(0,3).join(', ')||'Review',duration:0,questions:mis.map(m=>m.q),materi:[]};startExam(1)}
async function cp(s,b){try{await navigator.clipboard.writeText(s)}catch(e){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove()}
 if(b){const o=b.innerHTML;b.textContent=t('copied');setTimeout(()=>{b.innerHTML=o},1400)}}
const fixPrompt=()=>['The JSON you gave me failed the ExamForge checker with these errors:',...lastErr.map(x=>'- '+x),'','Fix ONLY these problems, keep everything else unchanged, and send back the COMPLETE corrected JSON as raw JSON only (no markdown fences, no explanation). Reminder: multiple_choice needs exactly 5 options A-E and one "answer" letter; true_false answer is true or false (no quotes); essay needs "expected_answer" or "keywords".'].join('\n');
const gv=i=>($('#'+i)||{}).value;
function gp(){const sj=(gv('gs')||'').trim()||'[SUBJECT]',n=k=>Math.min(100,Math.max(0,parseInt(gv(k))||0)),mc=n('gm'),tf=n('gt'),es=n('ge'),du=n('gd'),lg=gv('gl')||'English';
return `ROLE: You are an expert teacher and exam writer.
TASK: Turn the KISI-KISI (exam blueprint / study outline) that I paste or attach after this prompt into ONE JSON file for the ExamForge exam app. Subject: ${sj}. Write everything in ${lg}. If the kisi-kisi is a photo, read it carefully first.

OUTPUT RULES
1. Reply with raw JSON only: no markdown fences, no comments, no text before or after. Double quotes only, no trailing commas.
2. Create exactly ${mc} multiple_choice, ${tf} true_false and ${es} essay questions, spread over every topic/indicator in the kisi-kisi (more questions for heavier topics).
3. Use only content from the kisi-kisi. Never invent facts. One question tests one indicator.
4. "topic" = the short topic/indicator name from the kisi-kisi, spelled identically every time (the app uses it for the weak-topic report).
