<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ExamForge – Multi-Subject Study & Exam Simulator</title>
<style>
:root{
  --navy:#0f172a;
  --navy2:#1e293b;
  --pri:#4f46e5;
  --pri-h:#4338ca;
  --pri-soft:#eef2ff;
  --sec:#0ea5e9;
  --bg:#f4f7fb;
  --card:#ffffff;
  --tx:#0f172a;
  --mut:#64748b;
  --ok:#16a34a;
  --ok-bg:#dcfce7;
  --bad:#dc2626;
  --bad-bg:#fee2e2;
  --warn:#d97706;
  --bd:#e2e8f0;
  --sh:0 4px 16px -2px rgba(15,23,42,.06),0 2px 6px -1px rgba(15,23,42,.04);
  --sh-lg:0 12px 28px -4px rgba(15,23,42,.12);
  --rad:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--tx);
  overflow-x:hidden;
  min-height:100vh;
}

/* Header */
header{
  background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%);
  color:#fff;
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 12px rgba(15,23,42,.2);
}
header .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
header img{width:34px;height:34px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
header h1{font-size:1.15rem;margin:0;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .badge-sub{font-size:.68rem;background:rgba(255,255,255,.14);padding:2px 7px;border-radius:99px;font-weight:600;color:#c7d2fe;display:none}
@media(min-width:520px){header .badge-sub{display:inline-block}}

.hdr-tools{display:flex;align-items:center;gap:6px}
.icon-btn{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.16);
  color:#fff;
  border-radius:11px;
  min-height:36px;
  padding:5px 10px;
  font-size:.82rem;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:transform .15s ease,background .15s ease;
}
.icon-btn:hover{background:rgba(255,255,255,.2)}
.icon-btn:active{transform:scale(.95)}
.icon-btn.active{background:#4f46e5;border-color:#818cf8}
#net{font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:99px;background:#16a34a;color:#fff;white-space:nowrap}
#net.off{background:#d97706}

/* Audio Drawer */
.audio-panel{
  background:#1e293b;
  color:#f8fafc;
  border-bottom:1px solid rgba(255,255,255,.1);
  padding:12px 16px;
  display:none;
  animation:slideDown .22s ease;
}
.audio-panel.open{display:block}
.audio-inner{max-width:920px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.audio-grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.audio-panel button,.audio-panel label.abtn{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;
  min-height:36px;
  padding:6px 12px;
  border-radius:10px;
  font-size:.84rem;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:all .15s ease;
}
.audio-panel button:hover,.audio-panel label.abtn:hover{background:rgba(255,255,255,.18)}
.audio-panel button.on{background:#4f46e5;border-color:#818cf8}
.audio-panel input[type=range]{accent-color:#818cf8;width:95px;cursor:pointer}
.track-pill{font-size:.78rem;color:#cbd5e1;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:99px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Layout & Animations */
main{max-width:920px;margin:0 auto;padding:14px}
@media(min-width:700px){main{padding:24px}}
.view-enter{animation:fadeSlide .26s cubic-bezier(.16,1,.3,1)}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* Cards & Buttons */
.card{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:var(--rad);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--sh);
  overflow-wrap:anywhere;
}
h2{margin:0 0 8px;font-size:1.18rem;font-weight:800;letter-spacing:-.01em}
h3{margin:0 0 6px;font-size:1.02rem;font-weight:700}
.mut{color:var(--mut);font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}

.btn,button.b{
  font:inherit;
  font-weight:600;
  min-height:44px;
  padding:9px 16px;
  border-radius:12px;
  border:1px solid var(--bd);
  background:#fff;
  color:var(--tx);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease,background .14s ease;
  user-select:none;
}
.btn:hover,button.b:hover{border-color:#cbd5e1;box-shadow:0 3px 10px rgba(15,23,42,.06);transform:translateY(-1px)}
.btn:active,button.b:active{transform:scale(.97)}
.pri{background:linear-gradient(135deg,#4f46e5,#2563eb);border-color:transparent;color:#fff}
.pri:hover{box-shadow:0 6px 16px rgba(79,70,229,.32);border-color:transparent}
.soft{background:var(--pri-soft);border-color:#c7d2fe;color:var(--pri)}
.dng{color:var(--bad);border-color:#fecaca;background:#fff}
.dng:hover{background:#fef2f2;border-color:#fca5a5}
button:disabled{opacity:.45;pointer-events:none}

/* Hero Banner */
.hero{
  background:linear-gradient(135deg,#4f46e5 0%,#0ea5e9 100%);
  color:#fff;
  border:none;
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute;
  right:-30px;top:-30px;
  width:160px;height:160px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  pointer-events:none;
}
.hero h2{color:#fff;font-size:1.35rem;margin-bottom:4px}
.hero p{color:rgba(255,255,255,.9);margin:0;font-size:.94rem;max-width:620px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hero-pill{background:rgba(255,255,255,.18);backdrop-filter:blur(4px);padding:5px 12px;border-radius:99px;font-size:.82rem;font-weight:600}

/* Alerts */
.msg{border-radius:14px;padding:14px 16px;margin-bottom:14px;border:1px solid transparent;animation:fadeSlide .2s ease}
.msg.err{background:#fef2f2;color:#7f1d1d;border-color:#fecaca}
.msg.ok{background:#f0fdf4;color:#14532d;border-color:#bbf7d0}
.msg ul{margin:6px 0 0;padding-left:20px}

/* Subject Grid & Cards */
.sub-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
  margin-top:12px;
}
@media(min-width:600px){.sub-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:860px){.sub-grid{grid-template-columns:repeat(3,1fr)}}

.sub-card{
  background:#fff;
  border:1.5px solid var(--bd);
  border-radius:18px;
  padding:18px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:var(--sh);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  position:relative;
  overflow:hidden;
}
.sub-card:hover{
  transform:translateY(-3px);
  box-shadow:var(--sh-lg);
  border-color:var(--accent,#4f46e5);
}
.sub-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.sub-ico{
  width:48px;height:48px;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.55rem;
  background:var(--accent-bg,#eef2ff);
  color:var(--accent,#4f46e5);
  flex:none;
}
.sub-tag{
  font-size:.75rem;
  font-weight:700;
  padding:4px 10px;
  border-radius:99px;
  background:var(--accent-bg,#eef2ff);
  color:var(--accent,#4f46e5);
}
.sub-title{font-size:1.12rem;font-weight:800;margin:0 0 4px;color:var(--tx)}
.sub-meta{font-size:.85rem;color:var(--mut);display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}

/* Progress Bar */
.prog-wrap{margin-bottom:14px}
.prog-lbl{display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;color:var(--mut);margin-bottom:4px}
.prog-bar{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:var(--accent,#4f46e5);transition:width .4s ease}

/* Stats */
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.stat{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;flex:1 1 110px}
.stat b{display:block;font-size:1.35rem;line-height:1.2}

/* Filter Pills for History */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.pill{
  font-size:.82rem;font-weight:600;
  padding:6px 12px;min-height:34px;
  border-radius:99px;
  border:1px solid var(--bd);
  background:var(--bg);
  color:var(--mut);
  cursor:pointer;
  transition:all .15s ease;
}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff}

.hr{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--bd)}
.hr:first-of-type{border-top:none}
.hr>div{flex:1;min-width:0}
.hr .sc{font-weight:800;color:var(--pri);font-size:1.15rem;white-space:nowrap}

/* Exam Mode */
.bar{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--navy);color:#fff;
  border-radius:16px;padding:12px 16px;margin-bottom:14px;
  position:sticky;top:58px;z-index:10;
  box-shadow:0 6px 18px rgba(15,23,42,.18);
}
.bar-sub{font-size:.78rem;color:#93c5fd;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tm{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.05rem;background:rgba(255,255,255,.12);padding:5px 12px;border-radius:10px}
.tm.low{background:#dc2626;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

.qt{font-size:1.12rem;font-weight:700;margin-bottom:14px;line-height:1.5}
.pts{font-size:.78rem;color:var(--pri);background:var(--pri-soft);padding:2px 8px;border-radius:99px;font-weight:700;white-space:nowrap;vertical-align:middle}
.opt{
  display:flex;width:100%;gap:12px;text-align:left;justify-content:flex-start;align-items:center;
  margin-bottom:9px;padding:13px 14px;border-radius:14px;
  border:1.5px solid var(--bd);background:#fff;color:var(--tx);
  font:inherit;cursor:pointer;
  transition:all .14s ease;
}
.opt:hover{border-color:#818cf8;background:#f8fafc}
.opt b{
  min-width:30px;height:30px;border-radius:50%;
  background:var(--bg);color:var(--tx);
  display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:.9rem;
}
.opt.sel{border-color:var(--pri);background:var(--pri-soft);font-weight:600}
.opt.sel b{background:var(--pri);color:#fff}

textarea{
  width:100%;min-height:190px;font:inherit;padding:14px;
  border:1.5px solid var(--bd);border-radius:14px;resize:vertical;
  transition:border-color .15s ease;
}
textarea:focus{outline:none;border-color:var(--pri)}

.grid{display:flex;flex-wrap:wrap;gap:7px}
.grid button{
  min-height:42px;width:42px;padding:0;border-radius:11px;
  border:1.5px solid var(--bd);background:#fff;font-weight:700;cursor:pointer;
  transition:all .12s ease;
}
.grid .done{background:#dbeafe;border-color:#3b82f6;color:#1e3a8a}
.grid .cur{background:var(--navy);color:#fff;border-color:var(--navy);transform:scale(1.06)}

.nav{
  display:flex;gap:10px;position:sticky;bottom:0;
  background:rgba(244,247,251,.92);backdrop-filter:blur(6px);
  padding:10px 0;z-index:9;
}
.nav button{flex:1}

/* Completion & Review */
.celebrate{
  text-align:center;
  background:linear-gradient(180deg,#eef2ff 0%,#ffffff 100%);
  border:1.5px solid #c7d2fe;
}
.trophy{font-size:3rem;line-height:1;margin-bottom:6px;animation:popIn .45s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popIn{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.big{font-size:3.2rem;font-weight:900;color:var(--pri);line-height:1.05;margin:6px 0}
.rv{border-left:5px solid var(--bd)}
.rv.ok{border-left-color:var(--ok)}
.rv.no{border-left-color:var(--bad)}
.rv.es{border-left-color:var(--pri)}
.ans{background:var(--bg);border-radius:11px;padding:10px 13px;margin:7px 0;white-space:pre-wrap;font-size:.95rem}
input[type=number]{font:inherit;font-weight:700;width:92px;padding:8px 10px;border:1.5px solid var(--bd);border-radius:10px}

/* Modal / Briefing */
.brief-box{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.brief-box ul{margin:6px 0 0;padding-left:20px;color:var(--mut);font-size:.92rem}
.brief-box li{margin-bottom:4px}
</style>
</head>

      <button id="resetMusicBtn" data-do="resetMusic" style="display:none">↺ Built-in</button>
    </div>
  </div>
</div>

<main id="app"></main>

const norm = s => String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();

const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },

/* ================= WEB AUDIO API + CUSTOM MUSIC ENGINE ================= */
const SoundEngine = (() => {
  let ctx = null;
  let bgmPlaying = false;
  let bgmTimer = null;
  let step = 0;
  let customAudio = null;
  let customUrl = null;

  // Pleasant ambient pentatonic chord & melody sequence (Cmaj9 -> Am9 -> Fmaj9 -> G6)
  const chords = [
    [261.63, 329.63, 392.00, 493.88], // Cmaj7
    [220.00, 261.63, 329.63, 392.00], // Am7
    [174.61, 220.00, 261.63, 329.63], // Fmaj7
    [196.00, 246.94, 293.66, 392.00]  // G6
  ];
  const melody = [523.25, 659.25, 587.33, 493.88, 523.25, 392.00, 440.00, 493.88];

  function ensureCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    return ctx;
  }

  function effectiveVol(mult = 1) {
    if (prefs.muted) return 0;
    return Math.max(0, Math.min(1, prefs.volume * mult));
  }

  function playTone(freq, dur = 0.12, type = 'sine', volMult = 0.25, delay = 0) {
    if (!prefs.sfx || prefs.muted || prefs.volume <= 0) return;
    const c = ensureCtx();
    if (!c) return;
    const now = c.currentTime + delay;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    const v = effectiveVol(volMult);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  function sfx(kind) {
    if (!prefs.sfx || prefs.muted) return;
    switch (kind) {
      case 'click':
        playTone(540, 0.06, 'sine', 0.16);
        break;
      case 'subject':
        playTone(440, 0.10, 'triangle', 0.20, 0);
        playTone(659.25, 0.16, 'triangle', 0.22, 0.07);
        break;
      case 'nav':
        playTone(480, 0.06, 'sine', 0.14);
        break;
      case 'select':
        playTone(587.33, 0.08, 'sine', 0.18, 0);
        playTone(783.99, 0.10, 'sine', 0.15, 0.04);
        break;
      case 'start':
        playTone(392.00, 0.12, 'triangle', 0.22, 0);
        playTone(493.88, 0.12, 'triangle', 0.22, 0.09);
        playTone(587.33, 0.22, 'triangle', 0.25, 0.18);
        break;
      case 'submit':
        playTone(523.25, 0.12, 'sine', 0.22, 0);
        playTone(659.25, 0.18, 'sine', 0.22, 0.09);
        break;
      case 'complete':
        playTone(523.25, 0.14, 'triangle', 0.24, 0);
        playTone(659.25, 0.14, 'triangle', 0.24, 0.11);
        playTone(783.99, 0.16, 'triangle', 0.24, 0.22);
        playTone(1046.50, 0.36, 'triangle', 0.28, 0.33);
        break;
    }
  }

  function scheduleSynthStep() {
    if (!bgmPlaying || customAudio) return;
    const c = ensureCtx();
    if (!c) return;
    const now = c.currentTime;
    const v = effectiveVol(0.08);
    if (v > 0.0005) {
      // Every 4 steps play warm soft chord pad
      if (step % 4 === 0) {
        const chord = chords[(step / 4) % chords.length];
        chord.forEach(freq => {
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(v * 0.55, now + 0.35);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now);
          osc.stop(now + 2.7);
        });
      }
      // Gentle plucked piano-like note
      const noteFreq = melody[step % melody.length];
      const mOsc = c.createOscillator();
      const mGain = c.createGain();
      mOsc.type = 'triangle';
      mOsc.frequency.setValueAtTime(noteFreq, now);
      mGain.gain.setValueAtTime(0.0001, now);
      mGain.gain.linearRampToValueAtTime(v * 0.75, now + 0.03);
      mGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);
      mOsc.connect(mGain);
      mGain.connect(c.destination);
      mOsc.start(now);
      mOsc.stop(now + 0.9);
    }
    step++;
  }

  function startBgm() {
    bgmPlaying = true;
    if (customAudio) {
      customAudio.volume = effectiveVol(0.7);
      customAudio.play().catch(() => {});
    } else {
      ensureCtx();
      clearInterval(bgmTimer);
      scheduleSynthStep();
      bgmTimer = setInterval(scheduleSynthStep, 700);
    }
    updateAudioUI();
  }

  function stopBgm() {
    bgmPlaying = false;
    clearInterval(bgmTimer);
    if (customAudio) {
      customAudio.pause();
    }
    updateAudioUI();
  }

  function toggleBgm() {
    if (bgmPlaying) stopBgm();
    else startBgm();
  }

  function syncVolume() {
    if (customAudio) {
      customAudio.volume = effectiveVol(0.7);
    }
  }

  function loadCustomFile(file) {
    if (!file) return;
    if (customUrl) URL.revokeObjectURL(customUrl);
    customUrl = URL.createObjectURL(file);
    const aud = new Audio(customUrl);
    aud.loop = true;
    aud.volume = effectiveVol(0.7);
    aud.onerror = () => {
      alert(t('invalidAudio'));
      clearCustomMusic();
    };
    aud.oncanplaythrough = () => {
      clearInterval(bgmTimer);
      if (customAudio) customAudio.pause();
      customAudio = aud;
      prefs.customTrackName = file.name;
      savePrefs();
      startBgm();
    };
  }

  function clearCustomMusic() {
    if (customAudio) {
      customAudio.pause();
      customAudio = null;
    }
    if (customUrl) {
      URL.revokeObjectURL(customUrl);
      customUrl = null;
    }
    prefs.customTrackName = '';
    savePrefs();
    if (bgmPlaying) {
      startBgm();
    } else {
      updateAudioUI();
    }
  }

  return {
    sfx,
    toggleBgm,
    stopBgm,
    syncVolume,
    loadCustomFile,
    clearCustomMusic,
    isPlaying: () => bgmPlaying,
    hasCustom: () => !!customAudio
  };
})();

function updateAudioUI() {
  const playBtn = $('#bgmPlayBtn');
  const sfxBtn = $('#sfxToggleBtn');
  const muteBtn = $('#muteAllBtn');
  const volSlider = $('#volSlider');
  const trackName = $('#trackName');
  const resetBtn = $('#resetMusicBtn');
  const audBtn = $('#audBtn');
  const langBtn = $('#langBtn');

  if (langBtn) langBtn.textContent = '🌐 ' + prefs.lang.toUpperCase();
  if (playBtn) {
    playBtn.textContent = SoundEngine.isPlaying() ? t('pauseMusic') : t('playMusic');

  if (sfxBtn) {
    sfxBtn.textContent = prefs.sfx ? t('sfxOn') : t('sfxOff');
    sfxBtn.classList.toggle('on', prefs.sfx);

  if (muteBtn) {

  if (volSlider) volSlider.value = Math.round(prefs.volume * 100);

  }
  if (trackName) {
    trackName.textContent = SoundEngine.hasCustom() && prefs.customTrackName

      : t('builtInTrack');
  }
  if (audBtn) {

  }
}

}

function migrateLegacyBank(raw) {
  if (!raw) return null;
  if (Array.isArray(raw.subjects) && raw.subjects.length) return raw;
  if (Array.isArray(raw.questions) && raw.questions.length) {
    return {
      title: raw.title || 'Examination',
      duration: raw.duration || 0,
      subjects: [{
        name: raw.subject || 'General Subject',
        duration: raw.duration || 0,
        questions: raw.questions
      }]
    };
  }
  return null;
}

function validateSingleQuestion(q, labelPrefix, e) {
  if (!q || typeof q !== 'object') {
    e.push(labelPrefix + 'is not a valid object.');
    return null;
  }
  if (typeof q.question !== 'string' || !q.question.trim()) {
    e.push(labelPrefix + 'missing "question" text.');
  }
  const p = q.points == null ? 1 : q.points;
  if (typeof p !== 'number' || !(p > 0)) {
    e.push(labelPrefix + '"points" must be a number greater than 0.');
  }
  const ans = typeof q.answer === 'string' ? q.answer.trim().toUpperCase() : q.answer;
  if (q.type === 'multiple_choice') {
    if (!q.options || typeof q.options !== 'object') {
      e.push(labelPrefix + 'missing "options" (A–E).');
    } else {
      for (const k of L) {
        if (typeof q.options[k] !== 'string' || !q.options[k].trim()) {
          e.push(labelPrefix + 'option ' + k + ' is missing.');
        }
      }
    }
    if (!L.includes(ans)) {
      e.push(labelPrefix + '"answer" must be A, B, C, D, or E.');
    }
  } else if (q.type === 'essay') {
    if (q.keywords != null && !Array.isArray(q.keywords)) e.push(labelPrefix + '"keywords" must be a list.');
    if (q.rubric != null && !Array.isArray(q.rubric)) e.push(labelPrefix + '"rubric" must be a list.');
    if (!q.expected_answer && !(Array.isArray(q.keywords) && q.keywords.length)) {
      e.push(labelPrefix + 'needs "expected_answer" or "keywords".');
    }
  } else {
    e.push(labelPrefix + '"type" must be "multiple_choice" or "essay".');
  }
  return {
    ...q,
    answer: ans,
    points: p,
    keywords: Array.isArray(q.keywords) ? q.keywords.map(String) : [],
    rubric: Array.isArray(q.rubric) ? q.rubric : []
  };
}

function validate(d) {
  const e = [];
  if (!d || typeof d !== 'object' || Array.isArray(d)) {
    return { e: ['The file must contain a JSON object at the top level.'] };
  }
  if (typeof d.title !== 'string' || !d.title.trim()) {
    e.push('Missing "title" (text).');
  }
  if (d.duration != null && !(typeof d.duration === 'number' && d.duration >= 0)) {
    e.push('"duration" must be a number of minutes.');
  }

  // Case 1: New Multi-Subject Format ("subjects": [ { "name": "...", "questions": [...] } ])
  if (Array.isArray(d.subjects)) {
    if (!d.subjects.length) {
      return { e: [...e, '"subjects" list cannot be empty.'] };
    }
    const cleanSubjects = [];
    d.subjects.forEach((sub, sIdx) => {
      const sLabel = `Subject #${sIdx + 1}: `;
      if (!sub || typeof sub !== 'object') {
        e.push(sLabel + 'must be an object with "name" and "questions".');
        return;
      }
      if (typeof sub.name !== 'string' || !sub.name.trim()) {
        e.push(sLabel + 'missing subject "name". Every subject group must have a clear name.');
      }
      if (!Array.isArray(sub.questions) || !sub.questions.length) {
        e.push(sLabel + `"${sub.name || 'Unnamed'}" must contain a non-empty "questions" list.`);
        return;
      }
      const subDur = (typeof sub.duration === 'number' && sub.duration >= 0) ? sub.duration : (d.duration || 0);
      const qs = sub.questions.map((q, qIdx) =>
        validateSingleQuestion(q, `[${(sub.name || 'Subject ' + (sIdx + 1)).trim()}] Q${qIdx + 1}: `, e)
      );
      cleanSubjects.push({
        name: (sub.name || '').trim(),
        duration: subDur,
        questions: qs
      });
    });

    if (e.length) {
      return { e: e.slice(0, 8).concat(e.length > 8 ? [`…and ${e.length - 8} more issues.`] : []) };
    }
    return {
      bank: {
        title: d.title.trim(),
        duration: d.duration || 0,
        subjects: cleanSubjects
      }
    };
  }

  // Case 2: Flat "questions" array (either single legacy subject OR flat questions with per-question "subject" tags)
  if (Array.isArray(d.questions) && d.questions.length) {
    const hasPerQuestionSubject = d.questions.some(q => q && typeof q.subject === 'string' && q.subject.trim());
    const allHaveSubject = d.questions.every(q => q && typeof q.subject === 'string' && q.subject.trim());

    // Guardrail: If some questions have subject tags or multiple subjects are implied without clear labels
    if (hasPerQuestionSubject && !allHaveSubject) {
      return {
        e: [
          'Some questions have a "subject" label while others do not. Every question in a multi-subject bank must clearly identify which subject it belongs to.'
        ]
      };
    }

    // Check if top-level "subject" contains multiple comma/slash-separated subjects without grouping
    if (!hasPerQuestionSubject && typeof d.subject === 'string' && /[,;&\/]/.test(d.subject) && d.subject.split(/[,;&\/]/).filter(x => x.trim()).length > 1) {
      return {
        e: [
          `This file lists multiple subjects ("${d.subject}") in a single flat question list without identifying which question belongs to which subject.`,
          'Please organize questions into a "subjects" array (with "name" and "questions" for each subject) or add a "subject" field to each question.'
        ]
      };
    }

    if (hasPerQuestionSubject) {
      const grouped = new Map();
      d.questions.forEach((q, idx) => {
        const sName = q.subject.trim();
        const validQ = validateSingleQuestion(q, `[${sName}] Q${idx + 1}: `, e);
        if (!grouped.has(sName)) grouped.set(sName, []);
        grouped.get(sName).push(validQ);
      });
      if (e.length) {
        return { e: e.slice(0, 8).concat(e.length > 8 ? [`…and ${e.length - 8} more issues.`] : []) };
      }
      const cleanSubjects = Array.from(grouped.entries()).map(([name, questions]) => ({
        name,
        duration: d.duration || 0,
        questions
      }));
      return {
        bank: {
          title: d.title.trim(),
          duration: d.duration || 0,
          subjects: cleanSubjects
        }
      };
    }

    // Backward-compatible Single-Subject ExamForge Format
    if (typeof d.subject !== 'string' || !d.subject.trim()) {
      return {
        e: [
          'Missing "subject" (text) or "subjects" array. Each question bank must identify its subject(s).'
        ]
      };
    }
    const qs = d.questions.map((q, i) => validateSingleQuestion(q, `Question ${i + 1}: `, e));
    if (e.length) {
      return { e: e.slice(0, 8).concat(e.length > 8 ? [`…and ${e.length - 8} more issues.`] : []) };
    }
    return {
      bank: {
        title: d.title.trim(),
        duration: d.duration || 0,
        subjects: [{
          name: d.subject.trim(),
          duration: d.duration || 0,
          questions: qs
        }]
      }
    };
  }

  return {
    e: [
      ...e,
      'Missing "subjects" array or "questions" list. Please check the Kisi-Kisi JSON structure.'
    ]
  };
}

function load(text, name) {
  let d;
  try {
    d = JSON.parse(text);
  } catch (x) {
    msg = { t: 'err', h: t('importErr', { name }), l: [t('invalidJson', { err: x.message })] };
    return home();
  }
  const v = validate(d);
  if (v.e) {
    msg = { t: 'err', h: t('importErr', { name }), l: v.e };
    return home();
  }
  bank = v.bank;
  fname = name;
  histFilter = 'ALL';
  ls.set('ef_bank', bank);
  ls.set('ef_file', name);
  SoundEngine.sfx('complete');
  msg = { t: 'ok', h: t('importedOk', { name }), l: [] };
  home();
}

            <div class="prog-lbl">
              <span>${best !== null ? t('bestScore', { s: best }) : t('notAttempted')}</span>
              <span>${subHist.length ? t('attemptsCount', { n: subHist.length }) : ''}</span>
            </div>
            <div class="prog-bar"><div class="prog-fill" style="width:${progressPct}%"></div></div>
          </div>
        </div>
        <button class="b pri" style="width:100%" data-sub="${idx}">${t('startSubject')} ▶</button>
      </div>`;
    }).join('') + `</div>`;
  }

  app.innerHTML = `<div class="view-enter">
    ${m ? `<div class="msg ${m.t}"><b>${esc(m.h)}</b>${m.l.length ? '<ul>' + m.l.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : ''}</div>` : ''}

    <div class="card hero">
      <h2>${t('heroTitle')}</h2>
      <p>${t('heroDesc')}</p>
      ${bank ? `<div class="hero-meta">
        <span class="hero-pill">📚 ${esc(bank.title)}</span>
        <span class="hero-pill">🗂️ ${t('subjectsCount', { n: bank.subjects.length })}</span>
        <span class="hero-pill">📝 ${t('questionsCount', { n: totalQs })}</span>
      </div>` : ''}
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
        <div>
          <h2>${t('bankHeader')}</h2>
          ${bank ? `<div class="mut"><b>${esc(bank.title)}</b> · ${esc(fname)}</div>` : `<p class="mut" style="margin:0">${t('noBank')}</p>`}
        </div>
      </div>

      <div class="row">
        <label class="btn ${bank ? 'soft' : 'pri'}" for="file">📂 ${t('importBtn')}</label>
        <input id="file" type="file" accept=".json,application/json" hidden>
        <button class="b" data-do="sample">✨ ${t('sampleBtn')}</button>
        ${bank ? `<button class="b dng" data-do="clear">🗑 ${t('clearBtn')}</button>` : ''}
      </div>

      ${subjectCardsHtml}
    </div>

    <div class="card">
      <h2>📊 ${t('histTitle')}</h2>
      ${allSubjectsInHist.length > 1 ? `
        <div class="pills">
          <button class="pill ${histFilter === 'ALL' ? 'on' : ''}" data-hfilter="ALL">${t('allSubjects')} (${hist.length})</button>
          ${allSubjectsInHist.map(s => `<button class="pill ${histFilter === s ? 'on' : ''}" data-hfilter="${esc(s)}">${esc(s)} (${hist.filter(x => x.subject === s).length})</button>`).join('')}
        </div>
      ` : ''}
      ${filteredHist.length ? filteredHist.map(h => `
        <div class="hr">
          <div>
            <b>${esc(h.subject)}</b>
            <div class="mut">${esc(h.title)} · ${new Date(h.date).toLocaleString()} · ${t('questionsCount', { n: h.n })}</div>
          </div>
          <span class="sc">${h.score}</span>
          <button class="b dng" style="min-height:36px;padding:4px 10px" data-do="delh" data-id="${h.id}" aria-label="Delete">✕</button>
        </div>
      `).join('') : `<p class="mut">${t('noHist')}</p>`}
    </div>
  </div>`;
  updateAudioUI();
}

function showBriefing(idx) {
  selectedSubIdx = idx;
  const sub = bank.subjects[idx];
  const th = getSubjectTheme(sub.name, idx);
  const dur = sub.duration || bank.duration || 0;
  const pts = sub.questions.reduce((s, q) => s + q.points, 0);
  scrollTo(0, 0);

  app.innerHTML = `<div class="view-enter">
    <div class="card" style="border-top:5px solid ${th.color}">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <div class="sub-ico" style="background:${th.bg};color:${th.color}">${th.icon}</div>
        <div>
          <div class="mut" style="font-weight:700;text-transform:uppercase;font-size:.76rem">${esc(bank.title)}</div>
          <h2 style="margin:0;font-size:1.3rem">${esc(sub.name)}</h2>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><b>${sub.questions.length}</b>${t('questionsCount', { n: '' }).trim()}</div>
        <div class="stat"><b>${dur ? t('minLabel', { n: dur }) : t('noLimit')}</b>Duration</div>
        <div class="stat"><b>${pts}</b>${t('pointsCount', { n: '' }).trim()}</div>
      </div>

      <div class="brief-box">
        <b>📋 ${t('briefTitle')}</b>
        <ul>
          <li>${esc(t('briefRule1', { sub: sub.name }))}</li>
          <li>${esc(t('briefRule2'))}</li>
          <li>${esc(t('briefRule3'))}</li>
        </ul>
      </div>

      ${dur ? `<label style="display:flex;align-items:center;gap:8px;font-weight:600;margin:10px 0;cursor:pointer">
        <input type="checkbox" id="usetm" checked style="width:18px;height:18px;accent-color:var(--pri)">
        ${t('useTimer', { n: dur })}
      </label>` : ''}

      <div class="row">
        <button class="b pri" data-do="beginExam">${t('beginNow')}</button>
        <button class="b" data-do="home">${t('cancelBtn')}</button>
      </div>
    </div>
  </div>`;
}

function startExam() {
  const sub = bank.subjects[selectedSubIdx];
  if (!sub) return home();
  activeSub = sub;
  const u = $('#usetm');
  const dur = sub.duration || bank.duration || 0;
  ex = {
    a: {},
    cur: 0,
    end: dur && (!u || u.checked) ? Date.now() + dur * 60000 : 0
  };
  SoundEngine.sfx('start');
  window.onbeforeunload = e => { e.preventDefault(); e.returnValue = ''; };
  clearInterval(tick);
  tick = setInterval(tm, 1000);
  draw();
}

function tm() {
  const el = $('#tm');
  if (!el || !ex) return;
  if (!ex.end) {
    el.textContent = t('noTimer');
    return;
  }
  const l = Math.max(0, Math.round((ex.end - Date.now()) / 1000));
  el.textContent = '⏱ ' + String(Math.floor(l / 60)).padStart(2, '0') + ':' + String(l % 60).padStart(2, '0');
  el.classList.toggle('low', l < 60);
  if (l <= 0) {
    alert(t('timeUp'));
    submit(true);
  }
}

const nums = () => activeSub.questions.map((q, i) =>
  `<button class="${i === ex.cur ? 'cur' : ex.a[i] != null ? 'done' : ''}" data-go="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`
).join('');

const cnt = () => Object.keys(ex.a).length;

function draw() {
  const q = activeSub.questions[ex.cur];
  const n = activeSub.questions.length;
  scrollTo(0, 0);

  app.innerHTML = `<div class="view-enter">
    <div class="bar">
      <div>
        <div class="bar-sub">${esc(activeSub.name)}</div>
        <b>${t('qProgress', { c: ex.cur + 1, n })}</b>
      </div>
      <span id="tm" class="tm"></span>
    </div>

    <div class="card">
      <div class="qt">${esc(q.question)} <span class="pts">${t('pointsCount', { n: q.points })}</span></div>
      ${q.type === 'multiple_choice'
        ? L.map(k => `<button class="opt ${ex.a[ex.cur] === k ? 'sel' : ''}" data-pick="${k}"><b>${k}</b><span>${esc(q.options[k])}</span></button>`).join('')
        : `<textarea id="es" placeholder="${esc(t('essayPlaceholder'))}">${esc(ex.a[ex.cur] || '')}</textarea>`
      }
    </div>

    <div class="card">
      <div class="grid" id="gr">${nums()}</div>
      <p class="mut" id="ct" style="margin:10px 0 0">${t('answeredCount', { c: cnt(), n })}</p>
    </div>

    <div class="nav">
      <button class="b" data-do="prev" ${ex.cur ? '' : 'disabled'}>${t('prevBtn')}</button>
      <button class="b dng" data-do="submit">${t('submitBtn')}</button>
      <button class="b pri" data-do="next" ${ex.cur < n - 1 ? '' : 'disabled'}>${t('nextBtn')}</button>
    </div>
  </div>`;
  tm();
}

function submit(force) {
  const n = activeSub.questions.length;
  const un = n - cnt();
  if (!force) {
    SoundEngine.sfx('submit');
    if (!confirm(un ? t('confirmUnanswered', { u: un }) : t('confirmSubmit'))) return;
  }
  clearInterval(tick);
  window.onbeforeunload = null;

  const items = activeSub.questions.map((q, i) => {
    const a = ex.a[i];
    if (q.type === 'multiple_choice') {
      const ok = a === q.answer;
      return { q, a, ok, sc: ok ? q.points : 0, max: q.points };
    }
    const txt = norm(a || '');
    const ks = q.keywords;
    const hit = [];
    let f = 0;
    if (ks.length) {
      ks.forEach(k => {
        const kk = norm(k);
        if (!kk) return;
        if (txt.includes(kk)) {
          hit.push(k);
          f++;
        } else {
          const w = kk.split(' ').filter(x => x.length > 3);
          if (w.length > 1) {
            const r = w.filter(x => txt.includes(x)).length / w.length;
            if (r >= 0.6) f += r * 0.5;
          }
        }
      });
      f /= ks.length;
    } else {
      const w = [...new Set(norm(q.expected_answer).split(' ').filter(x => x.length > 3))];
      f = w.length ? w.filter(x => txt.includes(x)).length / w.length : 0;
    }
    return { q, a, sc: Math.round(q.points * Math.min(1, f) * 10) / 10, max: q.points, hit };
  });

  res = {
    items,
    rec: {
      id: Date.now(),
      subject: activeSub.name,
      title: bank.title,
      date: new Date().toISOString(),
      n,
      score: 0
    }
  };
  hist.unshift(res.rec);
  saveRes();
  SoundEngine.sfx('complete');
  result();
}

function tot() {
  const e = res.items.reduce((s, x) => s + x.sc, 0);
  const m = res.items.reduce((s, x) => s + x.max, 0);
  return m ? Math.round(e / m * 1000) / 10 : 0;
}

function saveRes() {
  res.rec.score = tot();
  ls.set('ef_hist', hist);
}

function result() {
  scrollTo(0, 0);
  const mc = res.items.filter(x => x.q.type === 'multiple_choice');
  const ok = mc.filter(x => x.ok).length;
  const es = res.items.filter(x => x.q.type === 'essay');
  const scoreVal = tot();
  const trophyIcon = scoreVal >= 80 ? '🏆' : scoreVal >= 60 ? '🌟' : '💪';

  app.innerHTML = `<div class="view-enter">
    <div class="card celebrate">
      <div class="trophy">${trophyIcon}</div>
      <h2>${t('completeTitle')}</h2>
      <p class="mut" style="margin:0">${esc(t('completeSub', { sub: activeSub.name }))}</p>
      <div class="big"><span id="fs">${scoreVal}</span><span class="mut" style="font-size:1.1rem"> / 100</span></div>

      <div class="stats" style="text-align:left">
        <div class="stat"><b style="color:var(--ok)">${ok}</b>${t('correctStat')}</div>
        <div class="stat"><b style="color:var(--bad)">${mc.length - ok}</b>${t('incorrectStat')}</div>
        <div class="stat"><b>${es.length}</b>${t('essayStat')}</div>
      </div>

      ${es.length ? `<p class="mut" style="text-align:left;font-size:.86rem">${t('essayNote')}</p>` : ''}

      <div class="row" style="justify-content:center">
        <button class="b pri" data-do="home">${t('backDash')}</button>
        <button class="b soft" data-do="retake">↻ ${esc(t('retakeSub', { sub: activeSub.name }))}</button>
      </div>
    </div>` +
    res.items.map((x, i) => {
      const q = x.q;
      const mcq = q.type === 'multiple_choice';
      return `<div class="card rv ${mcq ? (x.ok ? 'ok' : 'no') : 'es'}">
        <div class="qt">${i + 1}. ${esc(q.question)}</div>` +
        (mcq
          ? `<div class="ans">${t('yourAns')} ${x.a ? esc(x.a + '. ' + q.options[x.a]) : `<i>${t('notAns')}</i>`}</div>
             <div class="ans">${t('correctAns')} <b>${q.answer}. ${esc(q.options[q.answer])}</b></div>
             ${q.explanation ? `<p><b>${t('explanation')}</b> ${esc(q.explanation)}</p>` : ''}
             <div class="mut">${x.sc} / ${x.max} pts</div>`
          : `<div class="ans">${t('yourAns')}\n${x.a ? esc(x.a) : `<i>${t('notAns')}</i>`}</div>
             ${q.expected_answer ? `<div class="ans">${t('expectedAns')}\n${esc(q.expected_answer)}</div>` : ''}
             ${q.keywords.length ? `<p class="mut">${t('kwFound')} ${x.hit.length ? esc(x.hit.join(', ')) : t('none')} (${x.hit.length}/${q.keywords.length})</p>` : ''}
             ${q.rubric.length ? `<p class="mut">${t('rubric')} ` + q.rubric.map(r => esc(r.criterion) + ' (' + esc(r.points) + ')').join(' · ') + '</p>' : ''}
             <label>${t('scoreAdj')} <input type="number" min="0" max="${x.max}" step="0.5" value="${x.sc}" data-adj="${i}"> / ${x.max}</label>`
        ) + `</div>`;
    }).join('') + `</div>`;
}

/* ================= EVENT LISTENERS ================= */
document.addEventListener('click', e => {
  const tEl = e.target.closest('[data-do],[data-go],[data-pick],[data-sub],[data-hfilter]');
  if (!tEl) return;
  const d = tEl.dataset;

  if (d.sub !== undefined) {
    SoundEngine.sfx('subject');
    return showBriefing(+d.sub);
  }
  if (d.hfilter !== undefined) {
    SoundEngine.sfx('click');
    histFilter = d.hfilter;
    return home();
  }
  if (d.pick) {
    SoundEngine.sfx('select');
    ex.a[ex.cur] = d.pick;
    return draw();
  }
  if (d.go !== undefined) {
    SoundEngine.sfx('nav');
    ex.cur = +d.go;
    return draw();
  }

  switch (d.do) {
    case 'lang':
      SoundEngine.sfx('click');
      prefs.lang = prefs.lang === 'en' ? 'id' : 'en';
      savePrefs();
      updateAudioUI();
      net();
      if (ex && activeSub) draw();
      else if (res && activeSub) result();
      else if (selectedSubIdx !== null) showBriefing(selectedSubIdx);
      else home();
      return;

    case 'toggleAudioPanel':
      SoundEngine.sfx('click');
      $('#audioPanel').classList.toggle('open');
      updateAudioUI();
      return;

    case 'bgmToggle':
      SoundEngine.toggleBgm();
      return;

    case 'sfxToggle':
      prefs.sfx = !prefs.sfx;
      savePrefs();
      if (prefs.sfx) SoundEngine.sfx('click');
      updateAudioUI();
      return;

    case 'muteToggle':
      prefs.muted = !prefs.muted;
      savePrefs();
      SoundEngine.syncVolume();
      if (!prefs.muted) SoundEngine.sfx('click');
      updateAudioUI();
      return;

    case 'resetMusic':
      SoundEngine.sfx('click');
      SoundEngine.clearCustomMusic();
      return;

    case 'beginExam':
      return startExam();

    case 'retake':
      return showBriefing(selectedSubIdx);

    case 'prev':
      SoundEngine.sfx('nav');
      ex.cur--;
      return draw();

    case 'next':
      SoundEngine.sfx('nav');
      ex.cur++;
      return draw();

    case 'submit':
      return submit(false);

    case 'home':
      SoundEngine.sfx('click');
      return home();

    case 'clear':
      SoundEngine.sfx('click');
      if (confirm(t('clearConfirm'))) {
        bank = null;
        fname = '';
        ls.del('ef_bank');
        ls.del('ef_file');
        home();
      }
      return;

    case 'delh':
      SoundEngine.sfx('click');
      if (confirm(t('delHistConfirm'))) {
        hist = hist.filter(h => h.id != d.id);
        ls.set('ef_hist', hist);
        home();
      }
      return;

    case 'sample':
      SoundEngine.sfx('click');
      fetch('questions.json')
        .then(r => { if (!r.ok) throw 0; return r.text(); })
        .then(x => load(x, 'questions.json'))
        .catch(() => {
          msg = { t: 'err', h: 'Sample not available', l: [t('sampleErr')] };
          home();
        });
      return;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'volSlider') {
    prefs.volume = Math.max(0, Math.min(1, Number(e.target.value) / 100));
    if (prefs.volume > 0 && prefs.muted) prefs.muted = false;
    savePrefs();
    SoundEngine.syncVolume();
    updateAudioUI();
  }
  if (e.target.id === 'es' && ex) {
    const v = e.target.value;
    if (v.trim()) ex.a[ex.cur] = v;
    else delete ex.a[ex.cur];
    $('#gr').innerHTML = nums();
    $('#ct').textContent = t('answeredCount', { c: cnt(), n: activeSub.questions.length });
  }
});

document.addEventListener('change', e => {
  const tEl = e.target;
  if (tEl.id === 'file') {
    const f = tEl.files[0];
    tEl.value = '';
    if (f) {
      const r = new FileReader();
      r.onload = () => load(r.result, f.name);
      r.onerror = () => {
        msg = { t: 'err', h: t('importErr', { name: f.name }), l: [] };
        home();
      };
      r.readAsText(f);
    }
  }
  if (tEl.id === 'musicFile') {
    const f = tEl.files[0];
    tEl.value = '';
    if (f) SoundEngine.loadCustomFile(f);
  }
  if (tEl.dataset.adj !== undefined && res) {
    const x = res.items[+tEl.dataset.adj];
    let v = parseFloat(tEl.value);
    if (isNaN(v)) v = 0;
    v = Math.min(x.max, Math.max(0, v));
    x.sc = v;
    tEl.value = v;
    saveRes();
    $('#fs').textContent = tot();
  }
});

const net = () => {
  const n = $('#net');
  n.textContent = navigator.onLine ? t('online') : t('offline');
  n.className = navigator.onLine ? '' : 'off';
};
addEventListener('online', net);
addEventListener('offline', net);
net();

let dp;
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  dp = e;
  $('#inst').style.display = 'inline-flex';
  $('#inst').textContent = '⬇ ' + t('install');
});
$('#inst').onclick = () => {
  if (dp) {
    dp.prompt();
    dp = null;
    $('#inst').style.display = 'none';
  }
};

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}

home();
</script>
</body>
</html>
