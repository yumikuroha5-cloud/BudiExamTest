<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ExamForge – Multi-Subject Study & Exam Studio</title>
<style>
:root{
  --navy:#0f172a;--slate:#1e293b;--blue:#3b82f6;--indigo:#6366f1;--violet:#8b5cf6;
  --emerald:#10b981;--amber:#f59e0b;--rose:#f43f5e;--cyan:#06b6d4;
  --bg:#f1f5f9;--card:#ffffff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;
  --ok:#16a34a;--bad:#dc2626;--shadow:0 4px 20px -2px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}

/* Header & Audio Studio Bar */
header{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.hdr-top{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header img{width:34px;height:34px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
header h1{font-size:1.18rem;margin:0;flex:1;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.badge-ver{font-size:.68rem;background:rgba(99,102,241,.28);border:1px solid rgba(129,140,248,.4);color:#c7d2fe;padding:2px 8px;border-radius:99px;font-weight:600}
#net{font-size:.75rem;padding:4px 10px;border-radius:99px;background:#16a34a;font-weight:600}
#net.off{background:#d97706}

.audio-dock{max-width:960px;margin:8px auto 0;padding-top:8px;border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem}
.abtn{min-height:34px;padding:4px 11px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:transform .12s ease,background .15s ease}
.abtn:hover{background:rgba(255,255,255,.18)}
.abtn:active{transform:scale(.96)}
.abtn.on{background:var(--indigo);border-color:#818cf8;font-weight:600}
.vol-wrap{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);padding:3px 10px;border-radius:9px}
.vol-wrap input[type=range]{width:76px;accent-color:#818cf8;cursor:pointer}
.track-tag{color:#cbd5e1;font-size:.76rem;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Layout & Smooth Transitions */
main{max-width:960px;margin:0 auto;padding:16px}
.view-enter{animation:fadeSlide .26s cubic-bezier(.16,1,.3,1)}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);overflow-wrap:anywhere}
h2{margin:0 0 8px;font-size:1.15rem;letter-spacing:-.01em}
.mut{color:var(--mut);font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;align-items:center}

/* Buttons */
.btn,button{font:inherit;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--bd);background:#fff;color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;transition:transform .12s ease,box-shadow .15s ease,border-color .15s ease,background .15s ease}
.btn:hover,button:hover:not(:disabled){border-color:#94a3b8;transform:translateY(-1px)}
.btn:active,button:active:not(:disabled){transform:scale(.97)}
.pri{background:linear-gradient(135deg,var(--blue),var(--indigo));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(59,130,246,.28)}
.pri:hover{box-shadow:0 6px 16px rgba(59,130,246,.38);border-color:transparent}
.dng{color:var(--bad);border-color:#fecaca;background:#fff5f5}
.dng:hover{background:#fee2e2;border-color:#fca5a5}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* Hero Banner */
.hero{background:linear-gradient(135deg,#3b82f6 0%,#6366f1 55%,#8b5cf6 100%);color:#fff;border:none;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.hero h2{font-size:1.35rem;margin-bottom:4px}
.hero p{margin:0;color:rgba(255,255,255,.9);font-size:.94rem}

/* Alerts */
.msg{border-radius:14px;padding:13px 16px;margin-bottom:14px;border:1px solid transparent}
.msg.err{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.msg.ok{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
.msg ul{margin:6px 0 0;padding-left:20px}

/* Subject Grid & Cards */
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px;margin-top:12px}
.scard{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;position:relative;overflow:hidden}
.scard:hover{transform:translateY(-3px);box-shadow:0 12px 26px -4px rgba(15,23,42,.12);border-color:var(--accent,#3b82f6)}
.scard-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sicon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.55rem;flex:none;background:var(--accent-bg,#eff6ff);color:var(--accent,#3b82f6)}
.stitle{font-weight:700;font-size:1.08rem;line-height:1.25;margin-bottom:3px}
.smeta{font-size:.83rem;color:var(--mut)}
.prog-wrap{margin:8px 0 14px}
.prog-lbl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mut);margin-bottom:4px;font-weight:600}
.prog-bar{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent,#3b82f6);border-radius:99px;transition:width .4s ease}

/* Stats & History */
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.stat{background:var(--bg);border-radius:14px;padding:10px 14px;flex:1 1 115px}
.stat b{display:block;font-size:1.3rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{min-height:34px;padding:4px 12px;border-radius:99px;font-size:.82rem;background:var(--bg);border:1px solid var(--bd)}
.tab.act{background:var(--navy);color:#fff;border-color:var(--navy)}
.hr{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--bd)}
.hr>div{flex:1;min-width:0}
.hr .sc{font-weight:800;color:var(--indigo);font-size:1.15rem}

/* Briefing / Instructions Modal Card */
.brief-box{background:#f8fafc;border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.brief-box ul{margin:6px 0 0;padding-left:20px;color:#334155;font-size:.92rem}
.timer-opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
input[type=number]{font:inherit;width:95px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:#fff}

/* Exam Screen */
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:14px;padding:11px 16px;margin-bottom:12px;position:sticky;top:96px;z-index:10;box-shadow:0 4px 12px rgba(15,23,42,.15)}
.subj-pill{background:rgba(255,255,255,.14);padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:600}
.tm{font-variant-numeric:tabular-nums;font-weight:700}
.tm.low{color:#fca5a5;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.qt{font-size:1.08rem;font-weight:600;margin-bottom:14px;line-height:1.5}
.pts{font-size:.78rem;color:var(--mut);font-weight:500;white-space:nowrap}
.opt{display:flex;width:100%;gap:12px;text-align:left;justify-content:flex-start;margin-bottom:9px;padding:13px;border-radius:14px}
.opt b{min-width:28px;height:28px;border-radius:50%;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:.9rem}
.opt.sel{border-color:var(--indigo);background:#eef2ff;box-shadow:0 0 0 2px rgba(99,102,241,.18)}
.opt.sel b{background:var(--indigo);color:#fff}
textarea{width:100%;min-height:190px;font:inherit;padding:13px;border:1px solid var(--bd);border-radius:14px;resize:vertical}
textarea:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.grid{display:flex;flex-wrap:wrap;gap:7px}
.grid button{min-height:40px;width:40px;padding:0;border-radius:10px;font-size:.9rem}
.grid .done{background:#e0e7ff;border-color:#818cf8;color:#3730a3;font-weight:600}
.grid .cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.nav{display:flex;gap:10px;position:sticky;bottom:0;background:rgba(241,245,249,.92);backdrop-filter:blur(6px);padding:10px 0;z-index:9}
.nav button{flex:1}

/* Results Screen */
.celebrate{background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%);color:#fff;border:none}
.celebrate .mut{color:#cbd5e1}
.big{font-size:3.2rem;font-weight:800;background:linear-gradient(90deg,#60a5fa,#a78bfa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.rv{border-left:5px solid var(--bd)}
.rv.ok{border-color:var(--ok)}.rv.no{border-color:var(--bad)}.rv.es{border-color:var(--indigo)}
.ans{background:var(--bg);border-radius:11px;padding:9px 13px;margin:7px 0;white-space:pre-wrap;font-size:.94rem}

@media(min-width:700px){
  main{padding:24px}
  .opt:hover{border-color:var(--indigo);background:#f8fafc}
  .bar{top:64px}
}
</style>

<body>
<header>
  <div class="hdr-top">
    <img src="icon-192.png" alt="ExamForge">
    <h1>ExamForge <span class="badge-ver">Multi-Subject</span></h1>
    <button id="inst" class="pri" style="display:none;min-height:34px;padding:4px 12px;font-size:.82rem">Install App</button>
    <span id="net">Online</span>
  </div>
  <div class="audio-dock" aria-label="Study Audio Studio">
    <button id="bgmBtn" class="abtn" type="button">🎵 Study Music: Off</button>
    <label class="abtn" for="musicFile" title="Upload your own MP3, WAV, or OGG study track">📂 Upload Music</label>
    <input id="musicFile" type="file" accept="audio/*" hidden>
    <span id="trackName" class="track-tag">Synth Ambient Lo-Fi</span>
    <button id="sfxBtn" class="abtn on" type="button">🔔 SFX: On</button>
    <button id="muteBtn" class="abtn" type="button">🔊</button>
    <div class="vol-wrap" title="Master Volume">
      <span>Vol</span>
      <input id="volSlider" type="range" min="0" max="100" value="45">
    </div>
  </div>
</header>

<main id="app"></main>

<script>
const $=s=>document.querySelector(s),app=$('#app'),L='ABCDE';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const ls={
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Could not save: browser storage is full or blocked.')}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

/* =========================================================
   WEB AUDIO API SOUND ENGINE + CUSTOM MUSIC FILE PLAYER
   ========================================================= */
const AudioStudio=(()=>{
  let prefs=ls.get('ef_audio',{bgm:false,sfx:true,mute:false,vol:0.45});
  let ctx=null,masterGain=null,bgmTimer=null,step=0;
  let customAudio=new Audio();
  customAudio.loop=true;
  let customTrackName='';

  function ensureCtx(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      ctx=new AC();
      masterGain=ctx.createGain();
      masterGain.gain.value=prefs.mute?0:prefs.vol;
      masterGain.connect(ctx.destination);
    }
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    return ctx;
  }

  function syncGain(){
    const effective=prefs.mute?0:prefs.vol;
    if(masterGain&&ctx)masterGain.gain.setTargetAtTime(effective,ctx.currentTime,0.03);
    customAudio.volume=effective;
  }

  function tone(freq,dur=0.12,type='sine',vol=0.22,delay=0){
    if(!prefs.sfx||prefs.mute)return;
    const c=ensureCtx();if(!c)return;
    const t=c.currentTime+delay;
    const osc=c.createOscillator();
    const g=c.createGain();
    osc.type=type;
    osc.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g);g.connect(masterGain);
    osc.start(t);osc.stop(t+dur+0.02);
  }

  const sfx={
    click(){tone(520,0.06,'triangle',0.14)},
    subject(){tone(440,0.09,'sine',0.18,0);tone(659.25,0.14,'sine',0.2,0.07)},
    nav(){tone(390,0.06,'sine',0.13)},
    answer(){tone(587.33,0.08,'triangle',0.18,0);tone(783.99,0.11,'sine',0.16,0.05)},
    start(){[440,554.37,659.25,880].forEach((f,i)=>tone(f,0.16,'triangle',0.18,i*0.07))},
    submit(){tone(523.25,0.12,'sine',0.2,0);tone(659.25,0.18,'sine',0.22,0.1)},
    complete(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0.28,'sine',0.22,i*0.09))}
  };

  // Gentle ambient study chord progression (Fmaj7 -> Em7 -> Dm7 -> Cmaj7)
  const chords=[
    [174.61,220.00,261.63,329.63],
    [164.81,196.00,246.94,293.66],
    [146.83,174.61,220.00,261.63],
    [130.81,164.81,196.00,246.94]
  ];

  function playSynthPad(){
    if(!prefs.bgm||customTrackName)return;
    const c=ensureCtx();if(!c)return;
    const notes=chords[step%chords.length];
    step++;
    const now=c.currentTime;
    notes.forEach((freq,idx)=>{
      const osc=c.createOscillator();
      const g=c.createGain();
      osc.type=idx===0?'sine':'triangle';
      osc.frequency.setValueAtTime(freq,now);
      g.gain.setValueAtTime(0.0001,now);
      g.gain.linearRampToValueAtTime(0.038,now+0.8);
      g.gain.exponentialRampToValueAtTime(0.0001,now+3.4);
      osc.connect(g);g.connect(masterGain);
      osc.start(now);osc.stop(now+3.5);
    });
  }

  function startBgm(){
    prefs.bgm=true;save();syncGain();
    if(customTrackName){
      clearInterval(bgmTimer);bgmTimer=null;
      customAudio.play().catch(()=>{});
    }else{
      customAudio.pause();
      ensureCtx();
      if(!bgmTimer){
        playSynthPad();
        bgmTimer=setInterval(playSynthPad,3400);
      }
    }
    updateUI();
  }

  function stopBgm(){
    prefs.bgm=false;save();
    clearInterval(bgmTimer);bgmTimer=null;
    customAudio.pause();
    updateUI();
  }

  function toggleBgm(){prefs.bgm?stopBgm():startBgm()}
  function toggleSfx(){prefs.sfx=!prefs.sfx;save();if(prefs.sfx)sfx.click();updateUI()}
  function toggleMute(){prefs.mute=!prefs.mute;save();syncGain();updateUI()}
  function setVol(v){prefs.vol=Math.max(0,Math.min(1,v));if(prefs.vol>0&&prefs.mute)prefs.mute=false;save();syncGain();updateUI()}

  function loadCustomFile(file){
    if(!file)return;
    const url=URL.createObjectURL(file);
    customAudio.src=url;
    customTrackName=file.name;
    clearInterval(bgmTimer);bgmTimer=null;
    startBgm();
  }

  function save(){ls.set('ef_audio',prefs)}

  function updateUI(){
    const b=$('#bgmBtn'),s=$('#sfxBtn'),m=$('#muteBtn'),v=$('#volSlider'),t=$('#trackName');
    if(!b)return;
    b.textContent=prefs.bgm?'⏸ Study Music: On':'🎵 Study Music: Off';
    b.classList.toggle('on',prefs.bgm);
    s.textContent=prefs.sfx?'🔔 SFX: On':'🔕 SFX: Off';
    s.classList.toggle('on',prefs.sfx);
    m.textContent=prefs.mute?'🔇':'🔊';
    m.classList.toggle('on',prefs.mute);
    v.value=Math.round(prefs.vol*100);
    t.textContent=customTrackName||'Synth Ambient Lo-Fi';
  }

  // Never autoplay before user interaction; initialize UI reflecting paused state on load
  prefs.bgm=false;
  return{sfx,toggleBgm,toggleSfx,toggleMute,setVol,loadCustomFile,updateUI};
})();

/* =========================================================
   SUBJECT STYLING & ICON MAPPER
   ========================================================= */
const SUBJECT_THEMES=[
  {keys:['olah raga','pjok','penjas','sport','olahraga'],icon:'⚽',accent:'#10b981',bg:'#ecfdf5'},
  {keys:['inggris','english'],icon:'🌍',accent:'#3b82f6',bg:'#eff6ff'},
  {keys:['pancasila','ppkn','pkn','civic'],icon:'🦅',accent:'#f43f5e',bg:'#fff1f2'},
  {keys:['matematika','math','kalkulus'],icon:'📐',accent:'#8b5cf6',bg:'#f5f3ff'},
  {keys:['indonesia','bahasa indonesia'],icon:'📚',accent:'#f59e0b',bg:'#fffbeb'},
  {keys:['fisika','kimia','biologi','ipa','science'],icon:'🔬',accent:'#06b6d4',bg:'#ecfeff'},
  {keys:['sejarah','ips','geografi','ekonomi','sosiologi'],icon:'🏛️',accent:'#d97706',bg:'#fef3c7'},
  {keys:['informatika','tik','komputer','coding'],icon:'💻',accent:'#6366f1',bg:'#eef2ff'}
];
const FALLBACK_PALETTE=[
  {icon:'📘',accent:'#3b82f6',bg:'#eff6ff'},
  {icon:'📗',accent:'#10b981',bg:'#ecfdf5'},
  {icon:'📙',accent:'#f59e0b',bg:'#fffbeb'},
  {icon:'📕',accent:'#f43f5e',bg:'#fff1f2'},
  {icon:'📓',accent:'#8b5cf6',bg:'#f5f3ff'}
];
function getSubjectVisual(name,idx=0){
  const low=String(name).toLowerCase();
  for(const t of SUBJECT_THEMES){
    if(t.keys.some(k=>low.includes(k)))return t;
  }
  return FALLBACK_PALETTE[idx%FALLBACK_PALETTE.length];
}

/* =========================================================
   STATE & MULTI-SUBJECT VALIDATION / MIGRATION
   ========================================================= */
let bank=ls.get('ef_bank',null);
// Migrate legacy single-subject bank in localStorage seamlessly
if(bank&&!Array.isArray(bank.subjects)&&Array.isArray(bank.questions)){
  bank={title:bank.title||'Question Bank',duration:bank.duration||0,subjects:[{name:bank.subject||'General',questions:bank.questions}]};
  ls.set('ef_bank',bank);
}
let fname=ls.get('ef_file','');
let hist=ls.get('ef_hist',[]);
let histFilter='ALL';
let selectedSubjIdx=null; // For pre-exam briefing screen
let activeSubj=null;      // Currently active subject object during exam/result
let ex=null,res=null,msg=null,tick=null;

function validateQuestionList(rawQs,prefix,errors){
  const out=[];
  rawQs.forEach((q,i)=>{
    const n=prefix+'Question '+(i+1)+': ';
    if(!q||typeof q!=='object'){errors.push(n+'is not a valid object.');return}
    if(typeof q.question!=='string'||!q.question.trim())errors.push(n+'missing "question" text.');
    const p=q.points==null?1:q.points;
    if(typeof p!=='number'||!(p>0))errors.push(n+'"points" must be a number above 0.');
    const ans=typeof q.answer==='string'?q.answer.trim().toUpperCase():q.answer;
    if(q.type==='multiple_choice'){
      if(!q.options||typeof q.options!=='object')errors.push(n+'missing "options".');
      else for(const k of L)if(typeof q.options[k]!=='string'||!q.options[k].trim())errors.push(n+'option '+k+' is missing.');
      if(!L.includes(ans))errors.push(n+'"answer" must be A, B, C, D or E.');
    }else if(q.type==='essay'){
      if(q.keywords!=null&&!Array.isArray(q.keywords))errors.push(n+'"keywords" must be a list.');
      if(q.rubric!=null&&!Array.isArray(q.rubric))errors.push(n+'"rubric" must be a list.');
      if(!q.expected_answer&&!(Array.isArray(q.keywords)&&q.keywords.length))errors.push(n+'needs "expected_answer" or "keywords".');
    }else{
      errors.push(n+'"type" must be "multiple_choice" or "essay".');
    }
    out.push({
      ...q,
      answer:ans,
      points:p,
      keywords:Array.isArray(q.keywords)?q.keywords.map(String):[],
      rubric:Array.isArray(q.rubric)?q.rubric:[]
    });
  });
  return out;
}

function validate(d){
  const e=[];
  if(!d||typeof d!=='object'||Array.isArray(d))return{e:['The file must contain a JSON object at the top level.']};
  if(typeof d.title!=='string'||!d.title.trim())e.push('Missing "title" (text).');

<script>
const $=s=>document.querySelector(s),app=$('#app'),L='ABCDE';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const ls={
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Could not save: browser storage is full or blocked.')}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

/* =========================================================
   WEB AUDIO API SOUND ENGINE + CUSTOM MUSIC FILE PLAYER
   ========================================================= */
const AudioStudio=(()=>{
  let prefs=ls.get('ef_audio',{bgm:false,sfx:true,mute:false,vol:0.45});
  let ctx=null,masterGain=null,bgmTimer=null,step=0;
  let customAudio=new Audio();
  customAudio.loop=true;
  let customTrackName='';

  function ensureCtx(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      ctx=new AC();
      masterGain=ctx.createGain();
      masterGain.gain.value=prefs.mute?0:prefs.vol;
      masterGain.connect(ctx.destination);
    }
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    return ctx;
  }

  function syncGain(){
    const effective=prefs.mute?0:prefs.vol;
    if(masterGain&&ctx)masterGain.gain.setTargetAtTime(effective,ctx.currentTime,0.03);
    customAudio.volume=effective;
  }

  function tone(freq,dur=0.12,type='sine',vol=0.22,delay=0){
    if(!prefs.sfx||prefs.mute)return;
    const c=ensureCtx();if(!c)return;
    const t=c.currentTime+delay;
    const osc=c.createOscillator();
    const g=c.createGain();
    osc.type=type;
    osc.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g);g.connect(masterGain);
    osc.start(t);osc.stop(t+dur+0.02);
  }

  const sfx={
    click(){tone(520,0.06,'triangle',0.14)},
    subject(){tone(440,0.09,'sine',0.18,0);tone(659.25,0.14,'sine',0.2,0.07)},
    nav(){tone(390,0.06,'sine',0.13)},
    answer(){tone(587.33,0.08,'triangle',0.18,0);tone(783.99,0.11,'sine',0.16,0.05)},
    start(){[440,554.37,659.25,880].forEach((f,i)=>tone(f,0.16,'triangle',0.18,i*0.07))},
    submit(){tone(523.25,0.12,'sine',0.2,0);tone(659.25,0.18,'sine',0.22,0.1)},
    complete(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0.28,'sine',0.22,i*0.09))}
  };

  // Gentle ambient study chord progression (Fmaj7 -> Em7 -> Dm7 -> Cmaj7)
  const chords=[
    [174.61,220.00,261.63,329.63],
    [164.81,196.00,246.94,293.66],
    [146.83,174.61,220.00,261.63],
    [130.81,164.81,196.00,246.94]
  ];

  function playSynthPad(){
    if(!prefs.bgm||customTrackName)return;
    const c=ensureCtx();if(!c)return;
    const notes=chords[step%chords.length];
    step++;
    const now=c.currentTime;
    notes.forEach((freq,idx)=>{
      const osc=c.createOscillator();
      const g=c.createGain();
      osc.type=idx===0?'sine':'triangle';
      osc.frequency.setValueAtTime(freq,now);
      g.gain.setValueAtTime(0.0001,now);
      g.gain.linearRampToValueAtTime(0.038,now+0.8);
      g.gain.exponentialRampToValueAtTime(0.0001,now+3.4);
      osc.connect(g);g.connect(masterGain);
      osc.start(now);osc.stop(now+3.5);
    });
  }

  function startBgm(){
    prefs.bgm=true;save();syncGain();
    if(customTrackName){
      clearInterval(bgmTimer);bgmTimer=null;
      customAudio.play().catch(()=>{});
    }else{
      customAudio.pause();
      ensureCtx();
      if(!bgmTimer){
        playSynthPad();
        bgmTimer=setInterval(playSynthPad,3400);
      }
    }
    updateUI();
  }

  function stopBgm(){
    prefs.bgm=false;save();
    clearInterval(bgmTimer);bgmTimer=null;
    customAudio.pause();
    updateUI();
  }

  function toggleBgm(){prefs.bgm?stopBgm():startBgm()}
  function toggleSfx(){prefs.sfx=!prefs.sfx;save();if(prefs.sfx)sfx.click();updateUI()}
  function toggleMute(){prefs.mute=!prefs.mute;save();syncGain();updateUI()}
  function setVol(v){prefs.vol=Math.max(0,Math.min(1,v));if(prefs.vol>0&&prefs.mute)prefs.mute=false;save();syncGain();updateUI()}

  function loadCustomFile(file){
    if(!file)return;
    const url=URL.createObjectURL(file);
    customAudio.src=url;
    customTrackName=file.name;
    clearInterval(bgmTimer);bgmTimer=null;
    startBgm();
  }

  function save(){ls.set('ef_audio',prefs)}

  function updateUI(){
    const b=$('#bgmBtn'),s=$('#sfxBtn'),m=$('#muteBtn'),v=$('#volSlider'),t=$('#trackName');
    if(!b)return;
    b.textContent=prefs.bgm?'⏸ Study Music: On':'🎵 Study Music: Off';
    b.classList.toggle('on',prefs.bgm);
    s.textContent=prefs.sfx?'🔔 SFX: On':'🔕 SFX: Off';
    s.classList.toggle('on',prefs.sfx);
    m.textContent=prefs.mute?'🔇':'🔊';
    m.classList.toggle('on',prefs.mute);
    v.value=Math.round(prefs.vol*100);
    t.textContent=customTrackName||'Synth Ambient Lo-Fi';
  }

  // Never autoplay before user interaction; initialize UI reflecting paused state on load
  prefs.bgm=false;
  return{sfx,toggleBgm,toggleSfx,toggleMute,setVol,loadCustomFile,updateUI};
})();

/* =========================================================

const SUBJECT_THEMES=[

  {keys:['fisika','kimia','biologi','ipa','science'],icon:'🔬',accent:'#06b6d4',bg:'#ecfeff'},
  {keys:['sejarah','ips','geografi','ekonomi','sosiologi'],icon:'🏛️',accent:'#d97706',bg:'#fef3c7'},
  {keys:['informatika','tik','komputer','coding'],icon:'💻',accent:'#6366f1',bg:'#eef2ff'}
];
const FALLBACK_PALETTE=[
  {icon:'📘',accent:'#3b82f6',bg:'#eff6ff'},
  {icon:'📗',accent:'#10b981',bg:'#ecfdf5'},
  {icon:'📙',accent:'#f59e0b',bg:'#fffbeb'},
  {icon:'📕',accent:'#f43f5e',bg:'#fff1f2'},
  {icon:'📓',accent:'#8b5cf6',bg:'#f5f3ff'}
];
function getSubjectVisual(name,idx=0){
  const low=String(name).toLowerCase();
  for(const t of SUBJECT_THEMES){
    if(t.keys.some(k=>low.includes(k)))return t;
  }
  return FALLBACK_PALETTE[idx%FALLBACK_PALETTE.length];
}

/* =========================================================
   STATE & MULTI-SUBJECT VALIDATION / MIGRATION
   ========================================================= */
let bank=ls.get('ef_bank',null);
// Migrate legacy single-subject bank in localStorage seamlessly
if(bank&&!Array.isArray(bank.subjects)&&Array.isArray(bank.questions)){
  bank={title:bank.title||'Question Bank',duration:bank.duration||0,subjects:[{name:bank.subject||'General',questions:bank.questions}]};
  ls.set('ef_bank',bank);
}
let fname=ls.get('ef_file','');
let hist=ls.get('ef_hist',[]);
let histFilter='ALL';
let selectedSubjIdx=null; // For pre-exam briefing screen
let activeSubj=null;      // Currently active subject object during exam/result
let ex=null,res=null,msg=null,tick=null;

function validateQuestionList(rawQs,prefix,errors){
  const out=[];
  rawQs.forEach((q,i)=>{
    const n=prefix+'Question '+(i+1)+': ';
    if(!q||typeof q!=='object'){errors.push(n+'is not a valid object.');return}
    if(typeof q.question!=='string'||!q.question.trim())errors.push(n+'missing "question" text.');
    const p=q.points==null?1:q.points;
    if(typeof p!=='number'||!(p>0))errors.push(n+'"points" must be a number above 0.');
    const ans=typeof q.answer==='string'?q.answer.trim().toUpperCase():q.answer;
    if(q.type==='multiple_choice'){
      if(!q.options||typeof q.options!=='object')errors.push(n+'missing "options".');
      else for(const k of L)if(typeof q.options[k]!=='string'||!q.options[k].trim())errors.push(n+'option '+k+' is missing.');
      if(!L.includes(ans))errors.push(n+'"answer" must be A, B, C, D or E.');
    }else if(q.type==='essay'){
      if(q.keywords!=null&&!Array.isArray(q.keywords))errors.push(n+'"keywords" must be a list.');
      if(q.rubric!=null&&!Array.isArray(q.rubric))errors.push(n+'"rubric" must be a list.');
      if(!q.expected_answer&&!(Array.isArray(q.keywords)&&q.keywords.length))errors.push(n+'needs "expected_answer" or "keywords".');
    }else{
      errors.push(n+'"type" must be "multiple_choice" or "essay".');
    }
    out.push({
      ...q,
      answer:ans,
      points:p,
