<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1d3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>ExamForge</title>
<style>
:root{--navy:#0b1d3a;--blue:#2f7df6;--bg:#f3f6fb;--tx:#0f1b33;--mut:#5a6785;--ok:#16a34a;--bad:#dc2626;--bd:#d8e0ee}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{width:32px;height:32px;border-radius:8px}header h1{font-size:1.15rem;margin:0;flex:1}
#net{font-size:.75rem;padding:3px 10px;border-radius:99px;background:#16a34a}#net.off{background:#d97706}
main{max-width:860px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;overflow-wrap:anywhere}
h2{margin:0 0 8px;font-size:1.1rem}.mut{color:var(--mut);font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn,button{font:inherit;min-height:46px;padding:8px 16px;border-radius:12px;border:1px solid var(--bd);background:#fff;color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.dng{color:var(--bad)}
button:disabled{opacity:.5}
.msg{border-radius:12px;padding:12px 16px;margin-bottom:12px}.msg.err{background:#fee2e2;color:#7f1d1d}.msg.ok{background:#dcfce7;color:#14532d}.msg ul{margin:6px 0 0;padding-left:20px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.stat{background:var(--bg);border-radius:12px;padding:8px 14px;flex:1 1 110px}.stat b{display:block;font-size:1.3rem}
.hr{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}.hr>div{flex:1;min-width:0}.hr .sc{font-weight:700;color:var(--blue);font-size:1.1rem}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:14px;padding:10px 16px;margin-bottom:12px;position:sticky;top:54px;z-index:4}
.tm{font-variant-numeric:tabular-nums;font-weight:700}.tm.low{color:#fca5a5}
.qt{font-size:1.1rem;font-weight:600;margin-bottom:12px}.pts{font-size:.75rem;color:var(--mut);font-weight:400;white-space:nowrap}
.opt{display:flex;width:100%;gap:12px;text-align:left;justify-content:flex-start;margin-bottom:8px;padding:12px}.opt b{min-width:26px;height:26px;border-radius:50%;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt.sel{border-color:var(--blue);background:#e8f0ff}.opt.sel b{background:var(--blue);color:#fff}
textarea{width:100%;min-height:200px;font:inherit;padding:12px;border:1px solid var(--bd);border-radius:12px;resize:vertical}
.grid{display:flex;flex-wrap:wrap;gap:6px}.grid button{min-height:42px;width:42px;padding:0}
.grid .done{background:#dbeafe;border-color:var(--blue)}.grid .cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.nav{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:8px 0}.nav button{flex:1}
.big{font-size:3rem;font-weight:800;color:var(--blue);line-height:1}
.rv{border-left:5px solid var(--bd)}.rv.ok{border-color:var(--ok)}.rv.no{border-color:var(--bad)}.rv.es{border-color:var(--blue)}
.ans{background:var(--bg);border-radius:10px;padding:8px 12px;margin:6px 0;white-space:pre-wrap}
input[type=number]{font:inherit;width:90px;padding:8px;border:1px solid var(--bd);border-radius:10px}
@media(min-width:700px){main{padding:24px}.opt:hover{border-color:var(--blue)}}
</style></head><body>
<header><img src="icon-192.png" alt=""><h1>ExamForge</h1><button id="inst" class="pri" style="display:none;min-height:34px">Install</button><span id="net">Online</span></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app'),L=['A','B','C','D','E'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Could not save: browser storage is full or blocked.')}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let bank=ls.get('ef_bank',null),fname=ls.get('ef_file',''),hist=ls.get('ef_hist',[]),ex=null,res=null,msg=null,tick=null;

function validate(d){const e=[];
if(!d||typeof d!=='object'||Array.isArray(d))return{e:['The file must contain a JSON object at the top level.']};
if(typeof d.title!=='string'||!d.title.trim())e.push('Missing "title" (text).');
if(typeof d.subject!=='string'||!d.subject.trim())e.push('Missing "subject" (text).');
if(d.duration!=null&&!(typeof d.duration==='number'&&d.duration>=0))e.push('"duration" must be a number of minutes.');
if(!Array.isArray(d.questions)||!d.questions.length)return{e:[...e,'"questions" must be a non-empty list.']};
const qs=d.questions.map((q,i)=>{const n='Question '+(i+1)+': ';
 if(!q||typeof q!=='object'){e.push(n+'is not an object.');return null}
 if(typeof q.question!=='string'||!q.question.trim())e.push(n+'missing "question" text.');
 const p=q.points==null?1:q.points;if(typeof p!=='number'||!(p>0))e.push(n+'"points" must be a number above 0.');
 const ans=typeof q.answer==='string'?q.answer.trim().toUpperCase():q.answer;
 if(q.type==='multiple_choice'){
  if(!q.options||typeof q.options!=='object')e.push(n+'missing "options".');
  else for(const k of L)if(typeof q.options[k]!=='string'||!q.options[k].trim())e.push(n+'option '+k+' is missing.');
  if(!L.includes(ans))e.push(n+'"answer" must be A, B, C, D or E.');
 }else if(q.type==='essay'){
  if(q.keywords!=null&&!Array.isArray(q.keywords))e.push(n+'"keywords" must be a list.');
  if(q.rubric!=null&&!Array.isArray(q.rubric))e.push(n+'"rubric" must be a list.');
  if(!q.expected_answer&&!(Array.isArray(q.keywords)&&q.keywords.length))e.push(n+'needs "expected_answer" or "keywords".');
 }else e.push(n+'"type" must be "multiple_choice" or "essay".');
 return{...q,answer:ans,points:p,keywords:Array.isArray(q.keywords)?q.keywords.map(String):[],rubric:Array.isArray(q.rubric)?q.rubric:[]}});
if(e.length)return{e:e.slice(0,8).concat(e.length>8?['…and '+(e.length-8)+' more problems.']:[])};
return{bank:{title:d.title.trim(),subject:d.subject.trim(),duration:d.duration||0,questions:qs}}}

function load(text,name){let d;
 try{d=JSON.parse(text)}catch(x){msg={t:'err',h:'Could not read "'+name+'"',l:['This is not valid JSON: '+x.message]};return home()}
 const v=validate(d);if(v.e){msg={t:'err',h:'"'+name+'" has a problem',l:v.e};return home()}
 bank=v.bank;fname=name;ls.set('ef_bank',bank);ls.set('ef_file',name);msg={t:'ok',h:'Imported "'+name+'"',l:[]};home()}

function home(){clearInterval(tick);ex=null;res=null;window.onbeforeunload=null;scrollTo(0,0);
 const m=msg;msg=null;
 app.innerHTML=(m?`<div class="msg ${m.t}"><b>${esc(m.h)}</b>${m.l.length?'<ul>'+m.l.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':''}</div>`:'')+
 `<div class="card"><h2>Question bank</h2>${bank?`<div style="font-weight:700;font-size:1.2rem">${esc(bank.title)}</div><div class="mut">${esc(bank.subject)} · file: ${esc(fname)}</div>
 <div class="stats"><div class="stat"><b>${bank.questions.length}</b>questions</div><div class="stat"><b>${bank.duration?bank.duration+' min':'None'}</b>time limit</div><div class="stat"><b>${bank.questions.reduce((s,q)=>s+q.points,0)}</b>total points</div></div>
 ${bank.duration?'<label><input type="checkbox" id="usetm" checked> Use the timer</label>':''}`:'<p class="mut">No question bank imported yet. Import a .json file to begin.</p>'}
 <div class="row"><label class="btn ${bank?'':'pri'}" for="file">Import Question Bank</label><input id="file" type="file" accept=".json,application/json" hidden>
 <button data-do="sample">Load sample</button>
 ${bank?'<button class="pri" data-do="start">Start Examination</button><button class="dng" data-do="clear">Clear question bank</button>':''}</div></div>
 <div class="card"><h2>Examination history</h2>${hist.length?hist.map(h=>`<div class="hr"><div><b>${esc(h.subject)}</b><div class="mut">${esc(h.title)} · ${new Date(h.date).toLocaleString()} · ${h.n} questions</div></div><span class="sc">${h.score}</span><button class="dng" data-do="delh" data-id="${h.id}" aria-label="Delete">✕</button></div>`).join(''):'<p class="mut">No completed examinations yet.</p>'}</div>`}

function startExam(){const u=$('#usetm');
 ex={a:{},cur:0,end:bank.duration&&(!u||u.checked)?Date.now()+bank.duration*6e4:0};
 window.onbeforeunload=e=>{e.preventDefault();e.returnValue=''};
 clearInterval(tick);tick=setInterval(tm,1000);draw()}
function tm(){const t=$('#tm');if(!t||!ex)return;if(!ex.end){t.textContent='No timer';return}
 const l=Math.max(0,Math.round((ex.end-Date.now())/1000));
 t.textContent='⏱ '+String(Math.floor(l/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0');t.classList.toggle('low',l<60);
 if(l<=0){alert('Time is up. Your answers will now be submitted.');submit(true)}}
const nums=()=>bank.questions.map((q,i)=>`<button class="${i===ex.cur?'cur':ex.a[i]!=null?'done':''}" data-go="${i}" aria-label="Question ${i+1}${ex.a[i]!=null?' answered':''}">${i+1}</button>`).join('');
const cnt=()=>Object.keys(ex.a).length;
function draw(){const q=bank.questions[ex.cur],n=bank.questions.length;scrollTo(0,0);
 app.innerHTML=`<div class="bar"><b>Question ${ex.cur+1} / ${n}</b><span id="tm" class="tm"></span></div>
 <div class="card"><div class="qt">${esc(q.question)} <span class="pts">(${q.points} pts)</span></div>
 ${q.type==='multiple_choice'?L.map(k=>`<button class="opt ${ex.a[ex.cur]===k?'sel':''}" data-pick="${k}"><b>${k}</b><span>${esc(q.options[k])}</span></button>`).join(''):`<textarea id="es" placeholder="Write your answer here…">${esc(ex.a[ex.cur]||'')}</textarea>`}</div>
 <div class="card"><div class="grid" id="gr">${nums()}</div><p class="mut" id="ct" style="margin:8px 0 0">${cnt()} of ${n} answered</p></div>
 <div class="nav"><button data-do="prev" ${ex.cur?'':'disabled'}>◀ Prev</button><button class="dng" data-do="submit">Submit</button><button class="pri" data-do="next" ${ex.cur<n-1?'':'disabled'}>Next ▶</button></div>`;tm()}
function submit(force){const n=bank.questions.length,un=n-cnt();
 if(!force&&!confirm(un?`You have ${un} unanswered question(s). Submit the examination now?`:'Submit the examination now?'))return;
 clearInterval(tick);window.onbeforeunload=null;
 const items=bank.questions.map((q,i)=>{const a=ex.a[i];
  if(q.type==='multiple_choice'){const ok=a===q.answer;return{q,a,ok,sc:ok?q.points:0,max:q.points}}
  const t=norm(a||''),ks=q.keywords,hit=[];let f=0;
  if(ks.length){ks.forEach(k=>{const kk=norm(k);if(!kk)return;if(t.includes(kk)){hit.push(k);f++}else{const w=kk.split(' ').filter(x=>x.length>3);if(w.length>1){const r=w.filter(x=>t.includes(x)).length/w.length;if(r>=.6)f+=r*.5}}});f/=ks.length}
  else{const w=[...new Set(norm(q.expected_answer).split(' ').filter(x=>x.length>3))];f=w.length?w.filter(x=>t.includes(x)).length/w.length:0}
  return{q,a,sc:Math.round(q.points*Math.min(1,f)*10)/10,max:q.points,hit}});
 res={items,rec:{id:Date.now(),subject:bank.subject,title:bank.title,date:new Date().toISOString(),n,score:0}};
 hist.unshift(res.rec);saveRes();result()}
function tot(){const e=res.items.reduce((s,x)=>s+x.sc,0),m=res.items.reduce((s,x)=>s+x.max,0);return m?Math.round(e/m*1000)/10:0}
function saveRes(){res.rec.score=tot();ls.set('ef_hist',hist)}
function result(){scrollTo(0,0);const mc=res.items.filter(x=>x.q.type==='multiple_choice'),ok=mc.filter(x=>x.ok).length,es=res.items.filter(x=>x.q.type==='essay');
 app.innerHTML=`<div class="card"><h2>Result · ${esc(bank.title)}</h2><div class="big"><span id="fs">${tot()}</span><span class="mut" style="font-size:1rem"> / 100</span></div>
 <div class="stats"><div class="stat"><b style="color:var(--ok)">${ok}</b>correct</div><div class="stat"><b style="color:var(--bad)">${mc.length-ok}</b>incorrect (multiple choice)</div><div class="stat"><b>${es.length}</b>essays (estimated)</div></div>
 <p class="mut">Essay scores are <b>estimates</b> from local keyword matching, not a judgment of understanding. Adjust them below if needed — the total updates automatically.</p>
 <div class="row"><button class="pri" data-do="home">Back to dashboard</button></div></div>`+
 res.items.map((x,i)=>{const q=x.q,mcq=q.type==='multiple_choice';
 return `<div class="card rv ${mcq?(x.ok?'ok':'no'):'es'}"><div class="qt">${i+1}. ${esc(q.question)}</div>`+
 (mcq?`<div class="ans">Your answer: ${x.a?esc(x.a+'. '+q.options[x.a]):'<i>not answered</i>'}</div><div class="ans">Correct answer: <b>${q.answer}. ${esc(q.options[q.answer])}</b></div>${q.explanation?`<p><b>Explanation:</b> ${esc(q.explanation)}</p>`:''}<div class="mut">${x.sc} / ${x.max} pts</div>`
 :`<div class="ans">Your answer:\n${x.a?esc(x.a):'<i>not answered</i>'}</div>${q.expected_answer?`<div class="ans">Expected answer:\n${esc(q.expected_answer)}</div>`:''}
 ${q.keywords.length?`<p class="mut">Keywords found: ${x.hit.length?esc(x.hit.join(', ')):'none'} (${x.hit.length}/${q.keywords.length})</p>`:''}
 ${q.rubric.length?'<p class="mut">Rubric: '+q.rubric.map(r=>esc(r.criterion)+' ('+esc(r.points)+')').join(' · ')+'</p>':''}
 <label>Score (estimated, editable): <input type="number" min="0" max="${x.max}" step="0.5" value="${x.sc}" data-adj="${i}"> / ${x.max}</label>`)+`</div>`}).join('')}

document.addEventListener('click',e=>{const t=e.target.closest('[data-do],[data-go],[data-pick]');if(!t)return;const d=t.dataset;
 if(d.pick){ex.a[ex.cur]=d.pick;return draw()}
 if(d.go!==undefined){ex.cur=+d.go;return draw()}
 switch(d.do){
 case'start':return startExam();
 case'prev':ex.cur--;return draw();
 case'next':ex.cur++;return draw();
 case'submit':return submit();
 case'home':return home();
 case'clear':if(confirm('Remove the imported question bank? History is kept.')){bank=null;fname='';ls.del('ef_bank');ls.del('ef_file');home()}return;
 case'delh':if(confirm('Delete this history record?')){hist=hist.filter(h=>h.id!=d.id);ls.set('ef_hist',hist);home()}return;
 case'sample':fetch('questions.json').then(r=>{if(!r.ok)throw 0;return r.text()}).then(x=>load(x,'questions.json')).catch(()=>{msg={t:'err',h:'Sample not available',l:['Open the app once while online, or import a .json file instead.']};home()});return}});
document.addEventListener('input',e=>{if(e.target.id==='es'&&ex){const v=e.target.value;if(v.trim())ex.a[ex.cur]=v;else delete ex.a[ex.cur];$('#gr').innerHTML=nums();$('#ct').textContent=cnt()+' of '+bank.questions.length+' answered'}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='file'){const f=t.files[0];t.value='';if(f){const r=new FileReader();r.onload=()=>load(r.result,f.name);r.onerror=()=>{msg={t:'err',h:'Could not open the file',l:[]};home()};r.readAsText(f)}}
 if(t.dataset.adj!==undefined&&res){const x=res.items[+t.dataset.adj];let v=parseFloat(t.value);if(isNaN(v))v=0;v=Math.min(x.max,Math.max(0,v));x.sc=v;t.value=v;saveRes();$('#fs').textContent=tot()}});

const net=()=>{const n=$('#net');n.textContent=navigator.onLine?'Online':'Offline mode';n.className=navigator.onLine?'':'off'};
addEventListener('online',net);addEventListener('offline',net);net();
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').style.display='block'});
$('#inst').onclick=()=>{if(dp){dp.prompt();dp=null;$('#inst').style.display='none'}};
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('service-worker.js').catch(()=>{});
home();
</script></body></html>
